# Single-instance StatefulSet, matching docker-compose.yml's single redis
# container (appendonly persistence, allkeys-lru eviction). For production
# HA, consider a managed Redis or Redis Sentinel/Cluster — out of scope here.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: autodialer
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - "$(REDIS_MAXMEMORY)"
            - --maxmemory-policy
            - allkeys-lru
          env:
            - name: REDIS_MAXMEMORY
              valueFrom:
                configMapKeyRef:
                  name: autodialer-config
                  key: REDIS_MAXMEMORY
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "384Mi"  # a bit above --maxmemory to leave headroom
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: autodialer
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  clusterIP: None
