; =============================================
; Fail2Ban Filter for Asterisk
; AutoDialer Ultimate v3.0.0
; =============================================

[INCLUDES]
; Read common definitions
before = common.conf


[Definition]
; =============================================
; Filter Definition
; =============================================

; Ignore these lines (no action)
ignoreregex =


; =============================================
; Main Failregex Patterns
; =============================================
failregex = ^%(__prefix_line)s.*Registration from '[^']*' failed for '<HOST>(:\d+)?' - Wrong password$
            ^%(__prefix_line)s.*Registration from '[^']*' failed for '<HOST>(:\d+)?' - No matching peer found$
            ^%(__prefix_line)s.*Registration from '[^']*' failed for '<HOST>(:\d+)?' - Username/auth name mismatch$
            ^%(__prefix_line)s.*Registration from '[^']*' failed for '<HOST>(:\d+)?' - Device does not match ACL$
            ^%(__prefix_line)s.*Registration from '[^']*' failed for '<HOST>(:\d+)?' - Peer is not supposed to register$
            ^%(__prefix_line)s.*Registration from '[^']*' failed for '<HOST>(:\d+)?' - ACL error .*$
            ^%(__prefix_line)s.*Call from '[^']*' \(<HOST>:\d+\) to extension '\d+' rejected because extension not found.*$
            ^%(__prefix_line)s.*Host <HOST> failed to authenticate as '[^']*'$
            ^%(__prefix_line)s.*No matching endpoint found for '[^']*' from <HOST>:\d+$
            ^%(__prefix_line)s.*Request from '<HOST>' failed for '[^']*' - No matching endpoint found$
            ^%(__prefix_line)s.*Request from '[^']*' failed for '<HOST>(:\d+)?' - No matching endpoint found$
            ^%(__prefix_line)s.*Failed to authenticate user .*@<HOST>.*$
            ^%(__prefix_line)s.*Friendly scanner from <HOST>.*$
            ^%(__prefix_line)s.*SIP/2.0 \d{3} .* from <HOST>.*$
            ^%(__prefix_line)s.*INVITE from <HOST>.* - No matching peer found$
            ^%(__prefix_line)s.*OPTIONS from <HOST>.* - No matching peer found$
            ^%(__prefix_line)s.*REGISTER from <HOST>.* - No matching peer found$
            ^%(__prefix_line)s.*SecurityEvent.*Failed to authenticate.*<HOST>.*$
            ^%(__prefix_line)s.*SecurityEvent.*Invalid password.*<HOST>.*$
            ^%(__prefix_line)s.*SecurityEvent.*Challenge failed.*<HOST>.*$
            ^%(__prefix_line)s.*NOTICE.*: <HOST> failed to authenticate as '[^']*'$


; =============================================
; AMI (Asterisk Manager Interface) Patterns
; =============================================
; Failed AMI authentication
failregex = ^%(__prefix_line)s.*AMI.*Failed to authenticate user .* from <HOST>$
            ^%(__prefix_line)s.*AMI.*Authentication failed for <HOST>$
            ^%(__prefix_line)s.*Manager.*Failed to authenticate user .* from <HOST>$
            ^%(__prefix_line)s.*Manager.*Login failed for .* from <HOST>$
            ^%(__prefix_line)s.*HTTP Manager.*Login failed for .* from <HOST>$


; =============================================
; SIP Scanning Patterns
; =============================================
; SIP scanners and brute force attempts
failregex = ^%(__prefix_line)s.*SIP/2.0 401 Unauthorized.*<HOST>.*$
            ^%(__prefix_line)s.*SIP/2.0 403 Forbidden.*<HOST>.*$
            ^%(__prefix_line)s.*SIP/2.0 407 Proxy Authentication Required.*<HOST>.*$
            ^%(__prefix_line)s.*Too many bad authentication attempts.*<HOST>.*$
            ^%(__prefix_line)s.*sip:/?.* from <HOST>.* - Failed to authenticate$
            ^%(__prefix_line)s.*sip:/?.* from <HOST>.* - No matching endpoint found$
            ^%(__prefix_line)s.*chan_sip.c:.* from '<HOST>.*' - Failed to authenticate$
            ^%(__prefix_line)s.*chan_pjsip.c:.* from '<HOST>.*' - Failed to authenticate$


; =============================================
; RTP/Media Patterns
; =============================================
; RTP attacks and unusual activity
failregex = ^%(__prefix_line)s.*RTP.*from <HOST>.*does not match expected source.*$
            ^%(__prefix_line)s.*RTP.*Packet from <HOST>.*dropped.*$
            ^%(__prefix_line)s.*Media.*from <HOST>.*rejected.*$


; =============================================
; Additional Security Events
; =============================================
failregex = ^%(__prefix_line)s.*SECURITY.*<HOST>.*Failed to authenticate.*$
            ^%(__prefix_line)s.*SECURITY.*<HOST>.*Invalid password.*$
            ^%(__prefix_line)s.*SECURITY.*<HOST>.*ACL denied.*$
            ^%(__prefix_line)s.*SECURITY.*<HOST>.*Challenge failed.*$
            ^%(__prefix_line)s.*SECURITY.*<HOST>.*Endpoint not found.*$


; =============================================
; Date/Time Patterns
; =============================================
; Asterisk log format: [YYYY-MM-DD HH:MM:SS] NOTICE[...]
; The __prefix_line includes the date/time pattern


; =============================================
; Testing Patterns
; =============================================
; Sample log lines that should match:
;
; [2024-01-15 10:30:45] NOTICE[12345]: chan_pjsip.c:3000 registration_request: Registration from '"100" <sip:100@192.168.1.1>' failed for '192.168.1.100:5060' - Wrong password
; [2024-01-15 10:31:12] NOTICE[12346]: chan_pjsip.c:2500 check_auth: Host 192.168.1.101 failed to authenticate as 'admin'
; [2024-01-15 10:32:00] SECURITY[12347]: res_security_log.c:135 security_event_stasis: SecurityEvent="FailedACL",Service="PJSIP",EventTV="2024-01-15T10:32:00.000+0000",Severity="Error",AccountID="unknown",SessionID="unknown",LocalAddress="IP:192.168.1.1:5060",RemoteAddress="IP:192.168.1.102:5060",Module="chan_pjsip",ACLName="acl-local"
; [2024-01-15 10:33:20] NOTICE[12348]: manager.c:1500 authenticate: 192.168.1.103 failed to authenticate as 'autodialer'


; =============================================
; Journalctl Support (Systemd)
; =============================================
[Init]
; If using journalctl instead of log files
journalmatch = _SYSTEMD_UNIT=asterisk.service


; =============================================
; Additional Configuration
; =============================================
; Maximum lines to buffer for multi-line matching
maxlines = 1

; Date pattern for timestamp extraction
datepattern = ^\[%%Y-%%m-%%d %%H:%%M:%%S\]

; Use DNS for hostname resolution
usedns = warn
