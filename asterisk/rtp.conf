; =============================================
; Asterisk RTP Configuration
; Real-time Transport Protocol Settings
; AutoDialer Ultimate v3.0.0
; =============================================

[general]
; =============================================
; General RTP Settings
; =============================================

; RTP port range start
; Default: 10000
rtpstart = 10000

; RTP port range end
; Default: 20000
; For 30+ concurrent calls, ensure enough ports (each call uses 2 ports)
rtpend = 20000

; Enable RTP checksums
; Default: no (recommended for performance)
rtpchecksums = no

; DTMF timeout (ms)
; Default: 3000
dtmftimeout = 3000

; RTP timeout (seconds) - when to consider RTP stream dead
; Default: 30
rtp_timeout = 30

; RTP hold timeout (seconds) - timeout for held calls
; Default: 60
rtp_timeout_hold = 60

; RTP keepalive interval (seconds)
; Default: 0 (disabled)
rtpkeepalive = 30

; Strict RTP protection
; Drop packets that don't come from the source
; Default: yes
strictrtp = yes

; Learning mode for strict RTP
; Allow learning of new source address
; Default: yes
learning_min_duration = 3
learning_max_duration = 60

; ICE support
; Interactive Connectivity Establishment
; Default: no
icesupport = no

; STUN server for NAT traversal
; Format: stunaddr = hostname:port
; stunaddr = stun.l.google.com:19302

; TURN server for NAT traversal
; turnaddr = turn.example.com:3478
; turnusername = username
; turnpassword = password

; RTP engine name
; Default: asterisk
rtpengine = asterisk

; Packetization time (ms)
; Default: 20
; packetization = 20

; Use PTIME from SDP
; Default: no
use_ptime = no

; Comfort noise generation
; Default: no
send_silence = no

; RFC 2833 DTMF compensation
; Adjust for network jitter
; Default: no
rfc2833compensate = no

; DTMF mode for INFO
; Default: no
dtmfmode = rfc2833

; RTP debug logging
; Default: off
rtpdebug = off

; RTCP (RTP Control Protocol) settings
; Send RTCP reports
; Default: yes
rtcpsend = yes

; RTCP interval (ms)
; Default: 5000
rtcpinterval = 5000

; RTCP timeout (seconds)
; Default: 5
rtcptimeout = 5

; SRTP (Secure RTP) settings
; Enable SRTP
; Default: no
srtpenable = no

; SRTP crypto suites
; srtpcrypto = AES_CM_128_HMAC_SHA1_80,AES_CM_128_HMAC_SHA1_32


; =============================================
; T.38 Fax Settings
; =============================================
; T.38 UDPTL start port
; Default: 4000
t38pt_udptlstart = 4000

; T.38 UDPTL end port
; Default: 4999
t38pt_udptlend = 4999

; T.38 error correction
; Default: fec
t38pt_udptl = yes,fec

; T.38 max datagram size
; Default: 400
t38pt_maxdatagram = 400

; T.38 fax detection
; Default: no
faxdetect = no


; =============================================
; RTP Statistics
; =============================================
; Enable RTP statistics
; Default: no
rtpstats = yes

; Statistics interval (seconds)
; Default: 10
rtpstatinterval = 10

; Log RTP statistics to file
; Default: no
rtpstatlog = yes
rtpstatlogfile = /var/log/asterisk/rtp_stats.log


; =============================================
; ICE (Interactive Connectivity Establishment)
; =============================================
[ice]
; ICE candidates
; include_local_candidates = yes
; include_stun_candidates = yes
; include_turn_candidates = yes

; ICE nomination
; nomination = aggressive


; =============================================
; STUN Configuration
; =============================================
[stun]
; STUN server
; server = stun.l.google.com:19302

; STUN refresh interval (seconds)
; refresh = 300


; =============================================
; TURN Configuration
; =============================================
[turn]
; TURN server
; server = turn.example.com:3478
; username = username
; password = password

; TURN refresh interval (seconds)
; refresh = 300


; =============================================
; Quality of Service (QoS)
; =============================================
[qos]
; DSCP (Differentiated Services Code Point) values
; For RTP audio packets
; Default: 46 (EF - Expedited Forwarding)
tos_audio = 46

; For RTP video packets
; Default: 34 (AF41 - Assured Forwarding)
tos_video = 34

; For SIP signaling
; Default: 26 (AF31 - Assured Forwarding)
tos_sip = 26

; For T.38 fax
; Default: 26
tos_fax = 26


; =============================================
; Port Calculation
; =============================================
; Available ports = rtpend - rtpstart + 1
; Each call uses 2 ports (RTP + RTCP)
; Max concurrent calls = (rtpend - rtpstart + 1) / 2
;
; Example with 10000-20000:
; Ports: 20000 - 10000 + 1 = 10001
; Max calls: 10001 / 2 = 5000 (more than enough for 150 calls)
