; =============================================
; Answering Machine Detection (AMD) Configuration
; AutoDialer Ultimate v3.0.0
; =============================================
;
; Used by AMD() in [sub-amd] (asterisk/extensions.conf), invoked from
; [sub-media] right after Answer() and before our own TTS playback starts -
; it needs to listen to what the far end says first, uninterrupted, to
; tell a human greeting from a voicemail/answering-machine greeting.
;
; These are Asterisk's stock sample values (previously implicitly inherited
; from whatever amd.conf the base OS package happened to ship - not tracked
; anywhere in this repo, unlike every other Asterisk config file here).
; Tracking it explicitly so a rebuild can't silently pick up a different
; upstream default. Reasonable starting point, but worth tuning against a
; sample of real RU voicemail/greeting recordings once available - these
; were never validated against real traffic.

[general]
; Maximum time allowed for the algorithm to decide HUMAN vs MACHINE
total_analysis_time = 5000

; Average noise level (0-32767) below which audio counts as silence
silence_threshold = 256

; Maximum silence duration before the greeting starts.
; If exceeded, the result is MACHINE.
initial_silence = 2500

; Silence after detecting a greeting. If exceeded, the result is HUMAN
; (i.e. the caller said something short, then stopped and is waiting).
after_greeting_silence = 800

; Maximum length of the initial greeting. If exceeded, the result is
; MACHINE (long, uninterrupted speech looks like a recorded message).
greeting = 1500

; Minimum duration of voice to be counted as a word
min_word_length = 100

; Maximum duration of a single voice utterance
maximum_word_length = 5000

; Minimum silence after a word before the next utterance counts as a new word
between_words_silence = 50

; Maximum number of words in the greeting before it's classified MACHINE
maximum_number_of_words = 2
