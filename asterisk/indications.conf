; =============================================
; Asterisk Indications Configuration
; Tone Definitions by Country
; AutoDialer Ultimate v3.0.0
; =============================================

[general]
; =============================================
; General Settings
; =============================================

; Default country for indications
; Used when no country is specified
country = ru

; Default language for voice prompts
language = ru

; Store custom tones in astdb
store_tone_in_astdb = no

; Search order for indications
; first = file-based, then config-based
search_order = file,config


