; =============================================
; Asterisk Dialplan Configuration
; AutoDialer Ultimate v3.0.0
; =============================================

[globals]
; =============================================
; Global Variables
; =============================================
; Без префикса "PJSIP/" - см. Dial() ниже: PJSIP/<номер>@<транк> - это
; правильный синтаксис chan_pjsip для набора произвольного номера через
; именованный транк. Раньше здесь стояло "PJSIP/291_endpoint" и Dial()
; собирал "PJSIP/291_endpoint/291" (через слэш) - формат легаси chan_sip,
; который chan_pjsip не понимает. Подтверждено живьём: res_pjsip.c
; ast_sip_create_dialog_uac падал с "Could not create dialog to invalid
; URI '291'" на каждый исходящий звонок, хотя и регистрация на FreePBX,
; и AOR были в полном порядке - проблема была не в SIP-соединении, а в
; синтаксисе самой команды Dial().
TRUNK_NAME = 291_endpoint
CALLER_ID = AutoDialer
MAX_RETRIES = 3
CALL_TIMEOUT = 30
DTMF_TIMEOUT = 10


; =============================================
; Dialer Bridge Context
; Entry point for all outbound calls
; Called via: Local/<number>@dialer_bridge/n
; =============================================
[dialer_bridge]
exten => _X.,1,NoOp(=== AutoDialer Bridge: Calling ${EXTEN} ===)
; Local/${EXTEN}@dialer_bridge/n (неоптимизированный Local-канал) иногда
; запускает этот extension НЕЗАВИСИМО на обеих половинах пары (";1" и
; ";2"), а не один раз - подтверждено живьём: одна половина реально
; дозванивалась (AMD, приветствие), другая через несколько секунд САМА
; заново ставила исходящий Dial() на тот же номер, и абонент получал два
; отдельных звонка подряд. linkedid общий у обеих половин и у всех
; порождённых ими каналов, так что используем его как ключ разовой
; блокировки в astdb (см. [hangup-handler] ниже - ключ больше НЕ снимается
; там, см. комментарий в этом контексте почему).
;
; ПРОВЕРКА-ЗАТЕМ-ЗАПИСЬ (GotoIf(DB_EXISTS)+Set(DB(...)=1)) САМА ПО СЕБЕ НЕ
; АТОМАРНА - это два отдельных шага диалплана, и обе половины Local-канала
; могут выполняться параллельно на разных потоках Asterisk. Если обе
; половины проверят DB_EXISTS ДО того, как любая из них успеет записать
; ключ, обе проходят проверку и обе доходят до Dial() - подтверждено
; живьём: два "Занято" почти в одну секунду на один и тот же номер при
; быстром отказе (набор занятого номера — Dial() возвращает DIALSTATUS
; мгновенно, окно гонки минимально, но не нулевое). LOCK()/UNLOCK()
; (func_lock) делает проверку+запись настоящей критической секцией:
; ${LOCK(name)} блокируется, пока лок не освободится, так что вторая
; половина гарантированно видит уже записанный DB_EXISTS.
same => n,Set(DIALER_LOCK_NAME=dialer_bridge_${CHANNEL(linkedid)})
same => n,Set(DIALER_LOCK_OK=${LOCK(${DIALER_LOCK_NAME})})
same => n,GotoIf($[${DB_EXISTS(dialer_bridge_lock/${CHANNEL(linkedid)})}]?duplicate,1)
same => n,Set(DB(dialer_bridge_lock/${CHANNEL(linkedid)})=1)
same => n,Set(DIALER_UNLOCK_OK=${UNLOCK(${DIALER_LOCK_NAME})})
same => n,Set(CAMPAIGN_ID=${CAMPAIGN_ID})
same => n,Set(RETRY_COUNT=${RETRY_COUNT})
same => n,Set(CALLERID(num)=${CALLER_ID})
same => n,Set(CALLERID(name)=Camp_${CAMPAIGN_ID})
same => n,Set(CHANNEL(hangup_handler_push)=hangup-handler,s,1)
same => n,Set(CDR(userfield)=campaign:${CAMPAIGN_ID})
; Double-underscore prefix: ORIGINAL_PHONE must survive into the channel
; spawned by Dial() below, since [sub-media] runs there (via the U() Gosub
; option) and reads ${ORIGINAL_PHONE} in every UserEvent(DialerResult,...)
; call. A plain (single-underscore) variable set on this channel is NOT
; visible on the newly dialed channel, so every DialerResult event's Phone
; field was always empty.
same => n,Set(__ORIGINAL_PHONE=${EXTEN})
; Приложение хранит и нормализует российские номера с кодом страны "7"
; (79991234567) - правильно для базы/отображения, но исходящий маршрут
; в FreePBX ждёт номера в домашнем формате с "8" (89991234567) и отвечает
; "484 Address Incomplete" на любой номер с "7", даже полный 11-значный -
; подтверждено живьём реальным звонком. Меняем только для этого исходящего
; плеча, ${ORIGINAL_PHONE} (для DialerResult/отчётов) уже сохранён выше в
; исходном виде.
same => n,Set(DIAL_NUMBER=${IF($["${EXTEN:0:1}"="7"]?8${EXTEN:1}:${EXTEN})})
same => n,Dial(PJSIP/${DIAL_NUMBER}@${TRUNK_NAME},${CALL_TIMEOUT},U(sub-media^${CAMPAIGN_ID}))
same => n,Goto(sub-dial-status,s,1)

exten => duplicate,1,NoOp(=== Повторный запуск dialer_bridge для linkedid ${CHANNEL(linkedid)} - пропускаем, звонок уже размещён другой половиной Local-канала ===)
same => n,Set(DIALER_UNLOCK_OK=${UNLOCK(${DIALER_LOCK_NAME})})
same => n,Hangup()


; =============================================
; Dial Status Handler
; Processes call outcomes after Dial()
; =============================================
; Reached via Goto(sub-dial-status,s,1) from [dialer_bridge] below, not
; Gosub - a plain jump, no Gosub stack frame is pushed. Every branch used
; to end in Return(), which has nothing to pop and logged
; "ERROR: app_stack.c:413 return_exec: Return without Gosub: stack is
; unallocated" on every single call, regardless of outcome - confirmed
; live in every trace this session. There is nothing to return TO (we
; jumped here, we didn't call in), so Hangup() is correct instead: on the
; failed/busy/noanswer branches the far end never answered, and on
; "answered" sub-media has already ended the channel itself (its own
; Hangup() during the U() Gosub run inside Dial()) - Hangup() here on an
; already-hung-up channel is a documented no-op, not a new error.
[sub-dial-status]
exten => s,1,NoOp(=== Dial Status: ${DIALSTATUS} ===)
same => n,GotoIf($["${DIALSTATUS}"="BUSY"]?busy)
same => n,GotoIf($["${DIALSTATUS}"="NOANSWER"]?noanswer)
same => n,GotoIf($["${DIALSTATUS}"="CHANUNAVAIL"]?failed)
same => n,GotoIf($["${DIALSTATUS}"="CONGESTION"]?failed)
same => n,GotoIf($["${DIALSTATUS}"="CANCEL"]?failed)
same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?answered)
same => n,Hangup()

same => n(busy),NoOp(=== Call Result: BUSY ===)
same => n,Set(CDR(userfield)=${CDR(userfield)},status=busy)
same => n,UserEvent(DialerResult,Status: busy,Campaign: ${CAMPAIGN_ID},Phone: ${ORIGINAL_PHONE},RetryCount: ${RETRY_COUNT},LinkedID: ${CHANNEL(linkedid)})
same => n,Hangup()

same => n(noanswer),NoOp(=== Call Result: NOANSWER ===)
same => n,Set(CDR(userfield)=${CDR(userfield)},status=noanswer)
same => n,UserEvent(DialerResult,Status: noanswer,Campaign: ${CAMPAIGN_ID},Phone: ${ORIGINAL_PHONE},RetryCount: ${RETRY_COUNT},LinkedID: ${CHANNEL(linkedid)})
same => n,Hangup()

same => n(failed),NoOp(=== Call Result: FAILED (${DIALSTATUS}) ===)
same => n,Set(CDR(userfield)=${CDR(userfield)},status=failed)
same => n,UserEvent(DialerResult,Status: failed,Campaign: ${CAMPAIGN_ID},Phone: ${ORIGINAL_PHONE},RetryCount: ${RETRY_COUNT},LinkedID: ${CHANNEL(linkedid)})
same => n,Hangup()

same => n(answered),NoOp(=== Call answered, handled by sub-media ===)
same => n,Hangup()


; =============================================
; Media Playback Subroutine (IVR)
; Called when call is answered
; =============================================
[sub-media]
exten => s,1,NoOp(=== Answer Detected - Campaign ${ARG1} ===)
same => n,Set(CAMPAIGN_ID=${ARG1})
same => n,Set(AUDIO_FILE=tts/main_${CAMPAIGN_ID})

; Check if custom audio exists, otherwise use default
same => n,GotoIf($[${STAT(e,${AUDIO_FILE})} = 1]?play)
same => n,Set(AUDIO_FILE=tts/default)
same => n(play),NoOp(=== Playing audio: ${AUDIO_FILE} ===)

; Answer and play
same => n,Progress()
same => n,Wait(0.3)
same => n,Answer()
same => n,Wait(0.2)

; AMD still runs (and finishes listening) BEFORE we start playing our own
; TTS over the line, purely so it can classify HUMAN vs MACHINE by analysing
; what the far end says first - our own Background() would drown that out
; if it ran concurrently. We used to hang up immediately on a MACHINE
; verdict instead of playing the pitch, but AMD's verdict here is based
; only on ${initialSilence} (2500ms) of silence after answer - a real
; person who just doesn't say "Алло"/"Да" right away (confirmed live: user
; picked up and stayed silent) is indistinguishable from a voicemail
; greeting at this point and was wrongly hung up on before ever hearing
; the message. The call was answered either way, so we always play the
; pitch now; AMDSTATUS is still recorded to CDR(userfield) below for
; reporting/stats, it just no longer terminates the call early.
same => n,Gosub(sub-amd,s,1)

same => n,Set(TIMEOUT(digit)=${DTMF_TIMEOUT})
same => n,Set(TIMEOUT(response)=${DTMF_TIMEOUT})
same => n,Background(${AUDIO_FILE})
same => n,WaitExten(${DTMF_TIMEOUT})


; =============================================
; DTMF Handlers
; =============================================

; DTMF 1 - Agreed
exten => 1,1,NoOp(=== DTMF 1: Agreed ===)
same => n,Set(CDR(userfield)=${CDR(userfield)},dtmf=1)
same => n,UserEvent(DialerResult,Status: agreed,Campaign: ${CAMPAIGN_ID},Phone: ${ORIGINAL_PHONE},DTMF: 1,LinkedID: ${CHANNEL(linkedid)})
same => n,Playback(tts/thanks_${CAMPAIGN_ID})
same => n,GotoIf($[${STAT(e,tts/thanks_${CAMPAIGN_ID})} = 1]?hangup)
same => n,Playback(tts/thanks_default)
same => n(hangup),Hangup()

; DTMF 2 - Declined
exten => 2,1,NoOp(=== DTMF 2: Declined ===)
same => n,Set(CDR(userfield)=${CDR(userfield)},dtmf=2)
same => n,UserEvent(DialerResult,Status: declined,Campaign: ${CAMPAIGN_ID},Phone: ${ORIGINAL_PHONE},DTMF: 2,LinkedID: ${CHANNEL(linkedid)})
same => n,Playback(tts/goodbye_${CAMPAIGN_ID})
same => n,GotoIf($[${STAT(e,tts/goodbye_${CAMPAIGN_ID})} = 1]?hangup)
same => n,Playback(tts/goodbye_default)
same => n(hangup),Hangup()

; DTMF 3 - Repeat Message
exten => 3,1,NoOp(=== DTMF 3: Repeat ===)
same => n,Set(CDR(userfield)=${CDR(userfield)},dtmf=3)
same => n,Background(${AUDIO_FILE})
same => n,WaitExten(${DTMF_TIMEOUT})

; DTMF 4 - Operator Request (optional)
exten => 4,1,NoOp(=== DTMF 4: Operator Request ===)
same => n,Set(CDR(userfield)=${CDR(userfield)},dtmf=4)
same => n,UserEvent(DialerResult,Status: operator,Campaign: ${CAMPAIGN_ID},Phone: ${ORIGINAL_PHONE},DTMF: 4,LinkedID: ${CHANNEL(linkedid)})
same => n,Playback(tts/operator_${CAMPAIGN_ID})
same => n,GotoIf($[${STAT(e,tts/operator_${CAMPAIGN_ID})} = 1]?hangup)
same => n,Playback(tts/operator_default)
same => n(hangup),Hangup()

; DTMF 5-9 - Custom actions (reserved)
exten => 5,1,NoOp(=== DTMF 5: Custom ===)
same => n,UserEvent(DialerResult,Status: custom5,Campaign: ${CAMPAIGN_ID},Phone: ${ORIGINAL_PHONE},DTMF: 5,LinkedID: ${CHANNEL(linkedid)})
same => n,Hangup()

exten => 6,1,NoOp(=== DTMF 6: Custom ===)
same => n,UserEvent(DialerResult,Status: custom6,Campaign: ${CAMPAIGN_ID},Phone: ${ORIGINAL_PHONE},DTMF: 6,LinkedID: ${CHANNEL(linkedid)})
same => n,Hangup()

exten => 7,1,NoOp(=== DTMF 7: Custom ===)
same => n,UserEvent(DialerResult,Status: custom7,Campaign: ${CAMPAIGN_ID},Phone: ${ORIGINAL_PHONE},DTMF: 7,LinkedID: ${CHANNEL(linkedid)})
same => n,Hangup()

exten => 8,1,NoOp(=== DTMF 8: Custom ===)
same => n,UserEvent(DialerResult,Status: custom8,Campaign: ${CAMPAIGN_ID},Phone: ${ORIGINAL_PHONE},DTMF: 8,LinkedID: ${CHANNEL(linkedid)})
same => n,Hangup()

exten => 9,1,NoOp(=== DTMF 9: Custom ===)
same => n,UserEvent(DialerResult,Status: custom9,Campaign: ${CAMPAIGN_ID},Phone: ${ORIGINAL_PHONE},DTMF: 9,LinkedID: ${CHANNEL(linkedid)})
same => n,Hangup()

; DTMF 0 - Custom
exten => 0,1,NoOp(=== DTMF 0: Custom ===)
same => n,UserEvent(DialerResult,Status: custom0,Campaign: ${CAMPAIGN_ID},Phone: ${ORIGINAL_PHONE},DTMF: 0,LinkedID: ${CHANNEL(linkedid)})
same => n,Hangup()

; DTMF * - Custom
exten => *,1,NoOp(=== DTMF *: Custom ===)
same => n,UserEvent(DialerResult,Status: star,Campaign: ${CAMPAIGN_ID},Phone: ${ORIGINAL_PHONE},DTMF: *,LinkedID: ${CHANNEL(linkedid)})
same => n,Hangup()

; DTMF # - Custom
exten => #,1,NoOp(=== DTMF #: Custom ===)
same => n,UserEvent(DialerResult,Status: hash,Campaign: ${CAMPAIGN_ID},Phone: ${ORIGINAL_PHONE},DTMF: #,LinkedID: ${CHANNEL(linkedid)})
same => n,Hangup()

; Timeout - No DTMF received
exten => t,1,NoOp(=== DTMF Timeout ===)
same => n,Set(CDR(userfield)=${CDR(userfield)},dtmf=timeout)
same => n,UserEvent(DialerResult,Status: timeout,Campaign: ${CAMPAIGN_ID},Phone: ${ORIGINAL_PHONE},LinkedID: ${CHANNEL(linkedid)})
same => n,Playback(tts/timeout_${CAMPAIGN_ID})
same => n,GotoIf($[${STAT(e,tts/timeout_${CAMPAIGN_ID})} = 1]?hangup)
same => n,Playback(tts/timeout_default)
same => n(hangup),Hangup()

; Invalid - Invalid DTMF received
exten => i,1,NoOp(=== Invalid DTMF: ${INVALID_EXTEN} ===)
same => n,Set(CDR(userfield)=${CDR(userfield)},dtmf=invalid)
same => n,UserEvent(DialerResult,Status: invalid_dtmf,Campaign: ${CAMPAIGN_ID},Phone: ${ORIGINAL_PHONE},DTMF: ${INVALID_EXTEN},LinkedID: ${CHANNEL(linkedid)})
same => n,Playback(invalid)
same => n,Background(${AUDIO_FILE})
same => n,WaitExten(${DTMF_TIMEOUT})


; =============================================
; Hangup Handler
; Called when channel hangs up
; =============================================
[hangup-handler]
exten => s,1,NoOp(=== Channel ${CHANNEL} hung up ===)
; No custom "Channel:" field here - every AMI event (including UserEvent)
; already carries Asterisk's own native "Channel:" header for the channel
; that raised it. Adding a second, identically-named "Channel:" field to
; the UserEvent body makes Asterisk emit it as a THIRD raw AMI line -
; giving the wire message two "Channel:" headers total. panoramisk's
; CaseInsensitiveDict silently stores repeated headers as a list instead
; of a string, so app.services.dialer.handle_ami_event's own
; `channel.startswith('Local/')` crashed with AttributeError: 'list'
; object has no attribute 'startswith' on every single DialerHangup event
; - confirmed live by capturing the raw parsed event, which showed
; Channel: ['Local/...;2', 'Local/...;2'] (the same value twice).
same => n,UserEvent(DialerHangup,LinkedID: ${CHANNEL(linkedid)},Status: ${DIALSTATUS},Duration: ${CDR(duration)},BillSec: ${CDR(billsec)})
; НЕ снимаем блокировку от дубликатов dialer_bridge здесь. Раньше делали
; это через Set(DB_DELETE(...)=) сразу по завершении ПЕРВОЙ (реальной)
; половины Local-канала - но вторая половина (";1" или ";2", смотря какая
; не была реальной) не гарантированно успевает дойти до своей проверки
; DB_EXISTS к этому моменту: подтверждено живьём, что она может начать
; исполнять [dialer_bridge] заметно ПОЗЖЕ, чем первая половина уже
; полностью завершила разговор и повесила трубку - в трассе она доходила
; до проверки блокировки уже ПОСЛЕ того, как этот самый Return() успевал
; удалить ключ, так что DB_EXISTS видела "0" и половина-дубликат уходила
; в повторный настоящий Dial() на тот же номер (второй реальный звонок,
; который в истории потом висел как "Неизвестно" без какого-либо DTMF).
; linkedid уникален для каждого звонка (генерируется Asterisk по
; временной метке и никогда не переиспользуется), так что оставлять этот
; ключ в astdb навсегда не создаёт коллизий с будущими звонками - только
; медленно растущее число записей, что безопаснее повторного дозвона.
same => n,Return()


; =============================================
; incoming - обработка настоящих входящих звонков
; (PJSIP endpoint context = incoming - см. pjsip.conf.template)
; =============================================
[incoming]
; PJSIP передаёт сюда реально набранный номер/extension (например "291" -
; собственный номер AutoDialer на FreePBX) как EXTEN, а не "s" - "s"
; используется только когда канал не сообщает конкретный extension.
; Без этого паттерна реальный входящий звонок отклонялся с "extension not
; found in context 'incoming'" - подтверждено живьём. _X. матчит любой
; набранный номер и просто передаёт управление в общую логику ниже.
exten => _X.,1,Goto(s,1)
exten => s,1,NoOp(=== Входящий звонок с ${CALLERID(num)} ===)
; Явный Answer() - без него канал остаётся в состоянии "звонит", и хотя
; Background() всё равно как-то проигрывает звук вызывающему (ранние
; медиа), MixMonitor не получает надёжного двустороннего аудиопотока для
; записи - подтверждено живьём: все .wav получались ровно 44 байта (один
; RIFF-заголовок, ноль сэмплов) независимо от реальной длительности
; звонка. [sub-media] (исходящие звонки, выше) всегда делает Answer()
; первым делом перед Background()/AMD - здесь этого не было.
same => n,Answer()
same => n,Set(CALLER_NUM=${CALLERID(num)})
same => n,Set(FILENAME=incoming_${STRFTIME(${EPOCH},,%Y%m%d_%H%M%S)}_${CALLERID(num)})
same => n,Set(REC_START=${EPOCH})
; Регистрация звонка в бэкенде (StopMixMonitor + POST /webhook) вынесена в
; hangup handler, а не оставлена в линейном потоке ниже - большинство
; звонящих вешают трубку задолго до Wait(30), а выполнение диалплана на
; канале обрывается сразу на хендапе (никакого "h" extension здесь нет),
; так что StopMixMonitor()/дальнейшие строки после Wait() просто никогда бы
; не выполнились для типичного короткого звонка. hangup handler гарантированно
; исполняется при любом сценарии завершения - тот же приём, что уже
; используется в [dialer_bridge] (CHANNEL(hangup_handler_push)=hangup-handler).
same => n,Set(CHANNEL(hangup_handler_push)=incoming-hangup,s,1)

; Выбор приветствия: настраивается в веб-интерфейсе (Настройки -> Входящие).
; SettingsService._apply_incoming_greeting (app/services/settings.py)
; симлинкует выбранный файл под tts/incoming_custom.sln при каждом
; сохранении настройки - тот же приём, что campaign.py использует для
; tts/main_<id>.sln (см. [sub-media] выше).
same => n,Set(GREETING_FILE=tts/incoming_custom)
; STAT() - обычная проверка файловой системы (буквальный stat() от текущей
; директории процесса), а не "умный" поиск звукового файла, которым
; занимается Background() (тот сам перебирает форматы/расширения и знает
; про папку sounds). ${GREETING_FILE} без расширения и без абсолютного
; пути STAT() никогда не находил, даже когда файл реально существовал
; (tts/incoming_custom.sln) - подтверждено живьём: GotoIf стабильно уходил
; в "0?play_greeting" (т.е. false), приветствие никогда не проигрывалось.
; Проверяем реальный путь с расширением, а Background() ниже используем
; в её привычном формате (относительный, без расширения).
same => n,GotoIf($[${STAT(e,/var/lib/asterisk/sounds/${GREETING_FILE}.sln)} = 1]?play_greeting)
same => n,Goto(default_greeting)

same => n(play_greeting),Background(${GREETING_FILE})
same => n,Goto(record)

same => n(default_greeting),Background(tts/incoming_welcome)

; Запись сообщения (StopMixMonitor - в hangup handler [incoming-hangup]
; ниже, см. комментарий у CHANNEL(hangup_handler_push) выше)
; Опция "b" ("только пока канал в мосте") здесь НЕ нужна и была причиной
; пустых записей: канал в этом контексте никогда никуда не мостится (нет
; Dial()/Bridge() - только Background()/Wait() на одном канале), так что
; с "b" MixMonitor не писал ни байта звука, что бы ни говорил звонящий -
; подтверждено живьём (все .wav ровно 44 байта = пустой RIFF-заголовок,
; Answer() выше это не исправил). Без "b" запись идёт всё время, пока
; MixMonitor запущен, независимо от моста - то, что здесь и нужно.
same => n(record),Playback(beep)
same => n,MixMonitor(/var/spool/asterisk/monitor/incoming/${FILENAME}.wav)
same => n,Wait(30)  ; Максимальная длительность записи 30 секунд

; Прощальное сообщение
same => n,Background(tts/thank_you)
same => n,Wait(1)
same => n,Hangup()


; =============================================
; Hangup handler для [incoming] - гарантированно останавливает запись и
; регистрирует звонок в бэкенде (POST /api/incoming-calls/webhook,
; auto_transcribe=True по умолчанию запускает расшифровку) независимо от
; того, чем закончился звонок - без этого файл записи оставался бы только
; на диске, без строки в БД и без возможности прослушать/расшифровать его
; через веб-интерфейс.
; =============================================
[incoming-hangup]
exten => s,1,NoOp(=== Входящий звонок ${CHANNEL} завершён - фиксируем запись ===)
; Идемпотентно: если MixMonitor уже не запущен, StopMixMonitor() ничего не делает.
same => n,StopMixMonitor()
same => n,Set(REC_DURATION=$[${EPOCH}-${REC_START}])
same => n,GotoIf($["${FILENAME}"=""]?done)
same => n,System(curl -s --max-time 5 -X POST http://127.0.0.1:8000/api/incoming-calls/webhook -H "Content-Type: application/json" -d '{"caller_number":"${CALLER_NUM}","recording_path":"/var/spool/asterisk/monitor/incoming/${FILENAME}.wav","duration":${REC_DURATION},"unique_id":"${UNIQUEID}","linked_id":"${CHANNEL(linkedid)}"}' &)
same => n(done),Return()


; =============================================
; AMD - Answering Machine Detection (Optional)
; =============================================
[sub-amd]
; Usage: Gosub(sub-amd,s,1)
exten => s,1,NoOp(=== AMD Detection ===)
same => n,AMD()
same => n,GotoIf($["${AMDSTATUS}"="MACHINE"]?machine)
same => n,GotoIf($["${AMDSTATUS}"="HUMAN"]?human)
same => n,GotoIf($["${AMDSTATUS}"="NOTSURE"]?human)
same => n,GotoIf($["${AMDSTATUS}"="HANGUP"]?hangup)
same => n,Return()

same => n(machine),NoOp(=== Answering Machine Detected ===)
same => n,Set(CDR(userfield)=${CDR(userfield)},amd=machine)
; No UserEvent(DialerResult,Status: machine,...) here anymore - sub-media
; now plays the pitch and waits for DTMF regardless of this verdict (see
; comment there), so firing a "machine" result immediately would have
; wrongly locked in that outcome via the Redis dedup guard in
; DialerManager._handle_user_event, hiding a real "agreed"/"declined" the
; person gives seconds later after actually hearing the message. AMDSTATUS
; is still logged to CDR(userfield) above for audit; the authoritative
; DialerResult now always comes from the DTMF handlers or the timeout
; branch in [sub-media]/its extensions below.
same => n,Return()

same => n(human),NoOp(=== Human Detected ===)
same => n,Set(CDR(userfield)=${CDR(userfield)},amd=human)
same => n,Return()

same => n(hangup),NoOp(=== Hangup during AMD ===)
same => n,Return()


; =============================================
; Call Recording (Optional)
; =============================================
[sub-record]
; Usage: Gosub(sub-record,s,1)
exten => s,1,NoOp(=== Starting Call Recording ===)
same => n,Set(FILENAME=${CAMPAIGN_ID}_${ORIGINAL_PHONE}_${STRFTIME(${EPOCH},,%Y%m%d_%H%M%S)})
same => n,MixMonitor(/var/spool/asterisk/monitor/${FILENAME}.wav,b)
same => n,Return()


; =============================================
; Test Extensions
; =============================================
[test]
; Echo test
exten => 100,1,Answer()
same => n,Echo()
same => n,Hangup()

; Playback test
exten => 101,1,Answer()
same => n,Playback(tts/main_1)
same => n,Hangup()

; DTMF test
exten => 102,1,Answer()
same => n,Read(digit,beep,1,,3,5)
same => n,SayDigits(${digit})
same => n,Hangup()

; Conference test (requires app_confbridge)
; exten => 200,1,Answer()
; same => n,ConfBridge(2000)
; same => n,Hangup()


; =============================================
; Default Context (Catch-all)
; =============================================
[default]
exten => _X.,1,NoOp(=== Unhandled call to ${EXTEN} ===)
same => n,Hangup()

exten => s,1,NoOp(=== Unhandled call ===)
same => n,Hangup()
