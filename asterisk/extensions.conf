[globals]
TRUNK_NAME = PJSIP/291_endpoint

[dialer_bridge]
exten => _X.,1,NoOp(=== Dialer Bridge: Calling ${EXTEN} ===)
same => n,Set(CAMPAIGN_ID=${CAMPAIGN_ID})
same => n,Set(RETRY_COUNT=${RETRY_COUNT})
same => n,Set(CALLERID(name)=Camp_${CAMPAIGN_ID})
same => n,Set(CHANNEL(hangup_handler_push)=hangup-handler,s,1)
same => n,Dial(${TRUNK_NAME}/${EXTEN},30,U(sub-media^${CAMPAIGN_ID}))
same => n,Goto(sub-dial-status,s,1)

[sub-dial-status]
exten => s,1,NoOp(=== Dial Status: ${DIALSTATUS} ===)
same => n,GotoIf($["${DIALSTATUS}"="BUSY"]?busy)
same => n,GotoIf($["${DIALSTATUS}"="NOANSWER"]?noanswer)
same => n,GotoIf($["${DIALSTATUS}"="CHANUNAVAIL"]?failed)
same => n,GotoIf($["${DIALSTATUS}"="CONGESTION"]?failed)
same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?answered)
same => n,Hangup()

same => n(busy),Set(CDR(userfield)=busy)
same => n,UserEvent(DialerResult,Status=busy,Campaign=${CAMPAIGN_ID},Phone=${EXTEN},RetryCount=${RETRY_COUNT})
same => n,Hangup()

same => n(noanswer),Set(CDR(userfield)=noanswer)
same => n,UserEvent(DialerResult,Status=noanswer,Campaign=${CAMPAIGN_ID},Phone=${EXTEN},RetryCount=${RETRY_COUNT})
same => n,Hangup()

same => n(failed),Set(CDR(userfield)=failed)
same => n,UserEvent(DialerResult,Status=failed,Campaign=${CAMPAIGN_ID},Phone=${EXTEN},RetryCount=${RETRY_COUNT})
same => n,Hangup()

same => n(answered),NoOp(=== Call answered, handled by sub-media ===)
same => n,Hangup()

[sub-media]
exten => s,1,NoOp(=== Answer detected. Campaign ${ARG1} ===)
same => n,Set(AUDIO_FILE=tts/main_${ARG1})
same => n,GotoIf($[${STAT(e,${AUDIO_FILE})} = 0]?play:default)
same => n(default),Set(AUDIO_FILE=tts/default)
same => n(play),Progress()
same => n,Wait(0.5)
same => n,Answer()
same => n,Wait(0.3)
same => n,Background(${AUDIO_FILE})
same => n,WaitExten(10)

exten => 1,1,NoOp(=== DTMF 1: Agreed ===)
same => n,UserEvent(DialerResult,Status=agreed,Campaign=${ARG1},Phone=${EXTEN})
same => n,Playback(tts/thanks_${ARG1})
same => n,Hangup()

exten => 2,1,NoOp(=== DTMF 2: Declined ===)
same => n,UserEvent(DialerResult,Status=declined,Campaign=${ARG1},Phone=${EXTEN})
same => n,Playback(tts/goodbye_${ARG1})
same => n,Hangup()

exten => 3,1,NoOp(=== DTMF 3: Repeat ===)
same => n,Background(${AUDIO_FILE})
same => n,WaitExten(10)

exten => t,1,NoOp(=== Timeout ===)
same => n,UserEvent(DialerResult,Status=timeout,Campaign=${ARG1},Phone=${EXTEN})
same => n,Playback(tts/timeout_${ARG1})
same => n,Hangup()

exten => i,1,NoOp(=== Invalid input ===)
same => n,Playback(invalid)
same => n,Background(${AUDIO_FILE})
same => n,WaitExten(10)

[hangup-handler]
exten => s,1,NoOp(=== Channel ${CHANNEL} hung up ===)
same => n,UserEvent(DialerHangup,Channel=${CHANNEL},LinkedID=${CHANNEL(linkedid)},Status=${DIALSTATUS})
same => n,Return()
