; =============================================
; AutoDialer Ultimate - Диалплан (extensions.conf)
; Версия: 3.0.0
; =============================================
; ВНИМАНИЕ: Этот файл использует переменные, которые заменяются
; при установке скриптом 05_dialplan_config.sh
; =============================================

[globals]
; =============================================
; Глобальные переменные диалплана
; =============================================
; Без префикса "PJSIP/" - см. Dial() ниже: PJSIP/<номер>@<транк> - это
; правильный синтаксис chan_pjsip (легаси chan_sip-формат
; "PJSIP/<транк>/<номер>" не поддерживается и валит каждый звонок с
; "Could not create dialog to invalid URI", подтверждено живьём).
TRUNK_NAME = ${FREEPBX_EXTENSION}_endpoint
CALLER_ID = AutoDialer
MAX_RETRIES = 3
CALL_TIMEOUT = 30
DTMF_TIMEOUT = 10


; =============================================
; КОНТЕКСТ: dialer_bridge
; Точка входа для всех исходящих звонков
; Вызывается через: Local/<номер>@dialer_bridge/n
; =============================================
[dialer_bridge]
exten => _X.,1,NoOp(=== AutoDialer: Вызов ${EXTEN} ===)
; Local/${EXTEN}@dialer_bridge/n иногда запускает этот extension
; независимо на обеих половинах пары - подтверждено живьём (двойной
; звонок абоненту). linkedid общий у обеих половин, используем как ключ
; разовой блокировки в astdb, снятой в [hangup-handler].
;
; ПРОВЕРКА-ЗАТЕМ-ЗАПИСЬ (GotoIf(DB_EXISTS)+Set(DB(...)=1)) сама по себе не
; атомарна - обе половины Local-канала могут выполняться параллельно, и
; обе могут проверить DB_EXISTS ДО того, как любая успеет записать ключ -
; подтверждено живьём: два "Занято" почти одновременно на один номер при
; быстром отказе. LOCK()/UNLOCK() (func_lock) делает проверку+запись
; настоящей критической секцией.
same => n,Set(DIALER_LOCK_NAME=dialer_bridge_${CHANNEL(linkedid)})
same => n,Set(DIALER_LOCK_OK=${LOCK(${DIALER_LOCK_NAME})})
same => n,GotoIf($[${DB_EXISTS(dialer_bridge_lock/${CHANNEL(linkedid)})}]?duplicate,1)
same => n,Set(DB(dialer_bridge_lock/${CHANNEL(linkedid)})=1)
same => n,Set(UNLOCK(${DIALER_LOCK_NAME})=)
same => n,Set(CAMPAIGN_ID=${CAMPAIGN_ID})
same => n,Set(RETRY_COUNT=${RETRY_COUNT})
same => n,Set(CALLERID(num)=${CALLER_ID})
same => n,Set(CALLERID(name)=Camp_${CAMPAIGN_ID})
same => n,Set(CHANNEL(hangup_handler_push)=hangup-handler,s,1)
same => n,Set(CDR(userfield)=campaign:${CAMPAIGN_ID})
same => n,Set(ORIGINAL_PHONE=${EXTEN})
; Приложение хранит номера с кодом "7" (79991234567), но исходящий
; маршрут FreePBX ждёт домашний формат с "8" и отвечает "484 Address
; Incomplete" на любой номер с "7" - подтверждено живьём. Меняем только
; для этого исходящего плеча.
same => n,Set(DIAL_NUMBER=${IF($["${EXTEN:0:1}"="7"]?8${EXTEN:1}:${EXTEN})})
same => n,Dial(PJSIP/${DIAL_NUMBER}@${TRUNK_NAME},${CALL_TIMEOUT},U(sub-media^${CAMPAIGN_ID}))
same => n,Goto(sub-dial-status,s,1)

exten => duplicate,1,NoOp(=== Повторный запуск dialer_bridge для linkedid ${CHANNEL(linkedid)} - пропускаем ===)
same => n,Set(UNLOCK(${DIALER_LOCK_NAME})=)
same => n,Hangup()


; =============================================
; КОНТЕКСТ: sub-dial-status
; Обработчик статусов звонка после Dial()
; =============================================
; Вызывается через Goto(sub-dial-status,s,1) из [dialer_bridge] ниже, а не
; Gosub - обычный переход, кадр стека Gosub не создаётся. Каждая ветка
; заканчивалась Return(), которому нечего было снимать со стека - на
; каждом звонке без исключения логировалось "ERROR: app_stack.c:413
; return_exec: Return without Gosub: stack is unallocated", подтверждено
; живьём во всех трассах этой сессии. Возвращаться некуда (мы сделали
; переход, а не вызов), поэтому правильно - Hangup(): на ветках
; busy/noanswer/failed абонент не ответил, а на "answered" sub-media уже
; сам завершил канал (собственным Hangup() внутри Gosub, запущенного через
; U() у Dial()) - Hangup() на уже завершённом канале документированно
; ничего не делает, новой ошибки не будет.
[sub-dial-status]
exten => s,1,NoOp(=== Статус набора: ${DIALSTATUS} ===)
same => n,GotoIf($["${DIALSTATUS}"="BUSY"]?busy)
same => n,GotoIf($["${DIALSTATUS}"="NOANSWER"]?noanswer)
same => n,GotoIf($["${DIALSTATUS}"="CHANUNAVAIL"]?failed)
same => n,GotoIf($["${DIALSTATUS}"="CONGESTION"]?failed)
same => n,GotoIf($["${DIALSTATUS}"="CANCEL"]?failed)
same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?answered)
same => n,Hangup()

; Ветка "Занято" (BUSY)
same => n(busy),NoOp(=== Результат: BUSY (Занято) ===)
same => n,Set(CDR(userfield)=${CDR(userfield)},status=busy)
same => n,UserEvent(DialerResult,Status=busy,Campaign=${CAMPAIGN_ID},Phone=${ORIGINAL_PHONE},RetryCount=${RETRY_COUNT},LinkedID=${CHANNEL(linkedid)})
same => n,Hangup()

; Ветка "Нет ответа" (NOANSWER)
same => n(noanswer),NoOp(=== Результат: NOANSWER (Нет ответа) ===)
same => n,Set(CDR(userfield)=${CDR(userfield)},status=noanswer)
same => n,UserEvent(DialerResult,Status=noanswer,Campaign=${CAMPAIGN_ID},Phone=${ORIGINAL_PHONE},RetryCount=${RETRY_COUNT},LinkedID=${CHANNEL(linkedid)})
same => n,Hangup()

; Ветка "Ошибка" (FAILED)
same => n(failed),NoOp(=== Результат: FAILED (${DIALSTATUS}) ===)
same => n,Set(CDR(userfield)=${CDR(userfield)},status=failed)
same => n,UserEvent(DialerResult,Status=failed,Campaign=${CAMPAIGN_ID},Phone=${ORIGINAL_PHONE},RetryCount=${RETRY_COUNT},LinkedID=${CHANNEL(linkedid)})
same => n,Hangup()

; Ветка "Ответил" (ANSWER) - обрабатывается в sub-media
same => n(answered),NoOp(=== Абонент ответил, обработка в sub-media ===)
same => n,Hangup()


; =============================================
; КОНТЕКСТ: sub-media
; IVR - воспроизведение аудио и обработка DTMF
; Вызывается при ответе абонента
; =============================================
[sub-media]
exten => s,1,NoOp(=== Ответ абонента - Кампания ${ARG1} ===)
same => n,Set(CAMPAIGN_ID=${ARG1})
same => n,Set(AUDIO_FILE=tts/main_${CAMPAIGN_ID})

; Проверка наличия кастомного аудио, иначе используется default
same => n,GotoIf($[${STAT(e,${AUDIO_FILE})} = 1]?play)
same => n,Set(AUDIO_FILE=tts/default)
same => n(play),NoOp(=== Воспроизведение: ${AUDIO_FILE} ===)

; Ответ на звонок и воспроизведение
same => n,Progress()
same => n,Wait(0.3)
same => n,Answer()
same => n,Wait(0.2)

; AMD должен отработать (и дослушать) ДО того, как начнём проигрывать
; свой TTS - иначе Background() заглушит то, что говорит абонент первым.
; Раньше при вердикте MACHINE звонок сразу вешался вместо проигрывания
; питча - но вердикт строится только на initialSilence (2500мс) молчания
; после ответа, и живой человек, который просто не сказал "Алло" сразу,
; неотличим на этом этапе от автоответчика - подтверждено живьём (взяли
; трубку, промолчали - и звонок обрывался до проигрывания сообщения).
; Раз звонок всё равно отвечен - теперь всегда проигрываем питч;
; AMDSTATUS по-прежнему пишется в CDR(userfield) внутри sub-amd для
; статистики, но больше не завершает звонок раньше времени.
same => n,Gosub(sub-amd,s,1)

same => n,Set(TIMEOUT(digit)=${DTMF_TIMEOUT})
same => n,Set(TIMEOUT(response)=${DTMF_TIMEOUT})
same => n,Background(${AUDIO_FILE})
same => n,WaitExten(${DTMF_TIMEOUT})


; =============================================
; ОБРАБОТЧИКИ DTMF
; =============================================

; DTMF 1 - Согласие
exten => 1,1,NoOp(=== DTMF 1: Согласие ===)
same => n,Set(CDR(userfield)=${CDR(userfield)},dtmf=1)
same => n,UserEvent(DialerResult,Status=agreed,Campaign=${CAMPAIGN_ID},Phone=${ORIGINAL_PHONE},DTMF=1,LinkedID=${CHANNEL(linkedid)})
same => n,Playback(tts/thanks_${CAMPAIGN_ID})
same => n,GotoIf($[${STAT(e,tts/thanks_${CAMPAIGN_ID})} = 1]?hangup)
same => n,Playback(tts/thanks_default)
same => n(hangup),Hangup()

; DTMF 2 - Отказ
exten => 2,1,NoOp(=== DTMF 2: Отказ ===)
same => n,Set(CDR(userfield)=${CDR(userfield)},dtmf=2)
same => n,UserEvent(DialerResult,Status=declined,Campaign=${CAMPAIGN_ID},Phone=${ORIGINAL_PHONE},DTMF=2,LinkedID=${CHANNEL(linkedid)})
same => n,Playback(tts/goodbye_${CAMPAIGN_ID})
same => n,GotoIf($[${STAT(e,tts/goodbye_${CAMPAIGN_ID})} = 1]?hangup)
same => n,Playback(tts/goodbye_default)
same => n(hangup),Hangup()

; DTMF 3 - Повторить сообщение
exten => 3,1,NoOp(=== DTMF 3: Повтор ===)
same => n,Set(CDR(userfield)=${CDR(userfield)},dtmf=3)
same => n,Background(${AUDIO_FILE})
same => n,WaitExten(${DTMF_TIMEOUT})

; DTMF 4 - Запрос оператора
exten => 4,1,NoOp(=== DTMF 4: Запрос оператора ===)
same => n,Set(CDR(userfield)=${CDR(userfield)},dtmf=4)
same => n,UserEvent(DialerResult,Status=operator,Campaign=${CAMPAIGN_ID},Phone=${ORIGINAL_PHONE},DTMF=4,LinkedID=${CHANNEL(linkedid)})
same => n,Playback(tts/operator_${CAMPAIGN_ID})
same => n,GotoIf($[${STAT(e,tts/operator_${CAMPAIGN_ID})} = 1]?hangup)
same => n,Playback(tts/operator_default)
same => n(hangup),Hangup()

; DTMF 5 - Пользовательское действие
exten => 5,1,NoOp(=== DTMF 5: Пользовательское ===)
same => n,UserEvent(DialerResult,Status=custom5,Campaign=${CAMPAIGN_ID},Phone=${ORIGINAL_PHONE},DTMF=5,LinkedID=${CHANNEL(linkedid)})
same => n,Hangup()

; DTMF 6 - Пользовательское действие
exten => 6,1,NoOp(=== DTMF 6: Пользовательское ===)
same => n,UserEvent(DialerResult,Status=custom6,Campaign=${CAMPAIGN_ID},Phone=${ORIGINAL_PHONE},DTMF=6,LinkedID=${CHANNEL(linkedid)})
same => n,Hangup()

; DTMF 7 - Пользовательское действие
exten => 7,1,NoOp(=== DTMF 7: Пользовательское ===)
same => n,UserEvent(DialerResult,Status=custom7,Campaign=${CAMPAIGN_ID},Phone=${ORIGINAL_PHONE},DTMF=7,LinkedID=${CHANNEL(linkedid)})
same => n,Hangup()

; DTMF 8 - Пользовательское действие
exten => 8,1,NoOp(=== DTMF 8: Пользовательское ===)
same => n,UserEvent(DialerResult,Status=custom8,Campaign=${CAMPAIGN_ID},Phone=${ORIGINAL_PHONE},DTMF=8,LinkedID=${CHANNEL(linkedid)})
same => n,Hangup()

; DTMF 9 - Пользовательское действие
exten => 9,1,NoOp(=== DTMF 9: Пользовательское ===)
same => n,UserEvent(DialerResult,Status=custom9,Campaign=${CAMPAIGN_ID},Phone=${ORIGINAL_PHONE},DTMF=9,LinkedID=${CHANNEL(linkedid)})
same => n,Hangup()

; DTMF 0 - Пользовательское действие
exten => 0,1,NoOp(=== DTMF 0: Пользовательское ===)
same => n,UserEvent(DialerResult,Status=custom0,Campaign=${CAMPAIGN_ID},Phone=${ORIGINAL_PHONE},DTMF=0,LinkedID=${CHANNEL(linkedid)})
same => n,Hangup()

; DTMF * - Пользовательское действие
exten => *,1,NoOp(=== DTMF *: Пользовательское ===)
same => n,UserEvent(DialerResult,Status=star,Campaign=${CAMPAIGN_ID},Phone=${ORIGINAL_PHONE},DTMF=*,LinkedID=${CHANNEL(linkedid)})
same => n,Hangup()

; DTMF # - Пользовательское действие
exten => #,1,NoOp(=== DTMF #: Пользовательское ===)
same => n,UserEvent(DialerResult,Status=hash,Campaign=${CAMPAIGN_ID},Phone=${ORIGINAL_PHONE},DTMF=#,LinkedID=${CHANNEL(linkedid)})
same => n,Hangup()

; Таймаут - DTMF не получен
exten => t,1,NoOp(=== Таймаут DTMF ===)
same => n,Set(CDR(userfield)=${CDR(userfield)},dtmf=timeout)
same => n,UserEvent(DialerResult,Status=timeout,Campaign=${CAMPAIGN_ID},Phone=${ORIGINAL_PHONE},LinkedID=${CHANNEL(linkedid)})
same => n,Playback(tts/timeout_${CAMPAIGN_ID})
same => n,GotoIf($[${STAT(e,tts/timeout_${CAMPAIGN_ID})} = 1]?hangup)
same => n,Playback(tts/timeout_default)
same => n(hangup),Hangup()

; Неверный ввод DTMF
exten => i,1,NoOp(=== Неверный DTMF: ${INVALID_EXTEN} ===)
same => n,Set(CDR(userfield)=${CDR(userfield)},dtmf=invalid)
same => n,UserEvent(DialerResult,Status=invalid_dtmf,Campaign=${CAMPAIGN_ID},Phone=${ORIGINAL_PHONE},DTMF=${INVALID_EXTEN},LinkedID=${CHANNEL(linkedid)})
same => n,Playback(invalid)
same => n,Background(${AUDIO_FILE})
same => n,WaitExten(${DTMF_TIMEOUT})


; =============================================
; КОНТЕКСТ: hangup-handler
; Обработчик завершения звонка
; =============================================
[hangup-handler]
exten => s,1,NoOp(=== Канал ${CHANNEL} завершён ===)
same => n,UserEvent(DialerHangup,Channel=${CHANNEL},LinkedID=${CHANNEL(linkedid)},Status=${DIALSTATUS},Duration=${CDR(duration)},BillSec=${CDR(billsec)})
same => n,Set(DB_DELETE(dialer_bridge_lock/${CHANNEL(linkedid)})=)
same => n,Return()


; =============================================
; КОНТЕКСТ: incoming
; Обработка входящих звонков
; =============================================
[incoming]
exten => s,1,NoOp(=== Входящий звонок с ${CALLERID(num)} ===)
same => n,Set(CALLER_NUM=${CALLERID(num)})
same => n,Set(FILENAME=incoming_${STRFTIME(${EPOCH},,%Y%m%d_%H%M%S)}_${CALLERID(num)})

; Выбор приветствия (из глобальной переменной или по умолчанию)
same => n,Set(GREETING_FILE=${GLOBAL(INCOMING_GREETING)})
same => n,GotoIf($["${GREETING_FILE}"=""]?default_greeting)
same => n,GotoIf($[${STAT(e,${GREETING_FILE})}=0]?default_greeting)
same => n,Background(${GREETING_FILE})
same => n,Goto(record)

same => n(default_greeting),Background(tts/incoming_welcome)

; Запись сообщения
same => n(record),MixMonitor(/var/spool/asterisk/monitor/incoming/${FILENAME}.wav,b)
same => n,Wait(30)  ; Максимальная длительность записи 30 секунд
same => n,StopMixMonitor()

; Прощальное сообщение
same => n,Background(tts/thank_you)
same => n,Wait(1)
same => n,Hangup()


; =============================================
; КОНТЕКСТ: sub-amd
; Определение автоответчика (Answering Machine Detection)
; Опционально, включается в настройках
; =============================================
[sub-amd]
exten => s,1,NoOp(=== Определение автоответчика ===)
same => n,AMD()
same => n,GotoIf($["${AMDSTATUS}"="MACHINE"]?machine)
same => n,GotoIf($["${AMDSTATUS}"="HUMAN"]?human)
same => n,GotoIf($["${AMDSTATUS}"="NOTSURE"]?human)
same => n,GotoIf($["${AMDSTATUS}"="HANGUP"]?hangup)
same => n,Return()

same => n(machine),NoOp(=== Обнаружен автоответчик ===)
same => n,Set(CDR(userfield)=${CDR(userfield)},amd=machine)
; Без UserEvent(DialerResult,Status=machine,...) здесь - sub-media теперь
; всё равно проигрывает питч и ждёт DTMF при любом вердикте AMD, так что
; отправка результата "machine" сразу заблокировала бы реальный
; "agreed"/"declined" через Redis-дедупликацию в
; DialerManager._handle_user_event. AMDSTATUS остаётся в CDR(userfield)
; для аудита; итоговый DialerResult теперь всегда приходит из обработчиков
; DTMF или из ветки таймаута.
same => n,Return()

same => n(human),NoOp(=== Обнаружен человек ===)
same => n,Set(CDR(userfield)=${CDR(userfield)},amd=human)
same => n,Return()

same => n(hangup),NoOp(=== Отбой во время AMD ===)
same => n,Return()


; =============================================
; КОНТЕКСТ: sub-record
; Запись разговора
; Опционально, включается в настройках
; =============================================
[sub-record]
exten => s,1,NoOp(=== Запуск записи разговора ===)
same => n,Set(FILENAME=${CAMPAIGN_ID}_${ORIGINAL_PHONE}_${STRFTIME(${EPOCH},,%Y%m%d_%H%M%S)})
same => n,MixMonitor(/var/spool/asterisk/monitor/${FILENAME}.wav,b)
same => n,Return()


; =============================================
; КОНТЕКСТ: test
; Тестовые номера для проверки работоспособности
; =============================================
[test]
; Эхо-тест (повторяет всё, что вы говорите)
exten => 100,1,Answer()
same => n,Echo()
same => n,Hangup()

; Проверка воспроизведения аудио
exten => 101,1,Answer()
same => n,Playback(tts/main_1)
same => n,Hangup()

; Проверка DTMF (читает нажатую цифру)
exten => 102,1,Answer()
same => n,Read(digit,beep,1,,3,5)
same => n,SayDigits(${digit})
same => n,Hangup()


; =============================================
; КОНТЕКСТ: default
; Заглушка для необработанных вызовов
; =============================================
[default]
exten => _X.,1,NoOp(=== Необработанный вызов на ${EXTEN} ===)
same => n,Hangup()

exten => s,1,NoOp(=== Необработанный вызов ===)
same => n,Hangup()
