; =============================================
; Asterisk Configuration File
; AutoDialer Ultimate v3.0.0
; =============================================

[directories]
; =============================================
; Directory paths for Asterisk
; =============================================
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin


[options]
; =============================================
; General Asterisk Options
; =============================================

; Verbosity level (0-10, higher = more verbose)
verbose = 3

; Debug level (0-10)
debug = 0

; Maximum number of simultaneous calls
; For dialer, set higher than expected peak
maxcalls = 150

; Maximum load average before rejecting calls
maxload = 10.0

; Minimum free memory (MB) before rejecting calls
; minmemfree = 100

; Transcode via SLN (signed linear) for better quality
transcode_via_sln = yes

; Run as asterisk user (security)
runuser = asterisk
rungroup = asterisk

; Language prefix for sound files
languageprefix = yes

; Include external configuration files
execincludes = yes

; Don't display certain warnings
dontwarn = yes

; Cache sound files
cache_media_frames = yes

; Record calls in UTC
; use_utc = no

; System name
systemname = AutoDialer

; Maximum number of file descriptors
; Set high for dialer applications
maxfiles = 655350

; Internal timing
internal_timing = yes

; Timing source
; timingfd = yes

; Lock files directory
lockdir = /var/lock/asterisk

; Core dump directory
dumpdir = /tmp


[files]
; =============================================
; File Permissions
; =============================================
astctlpermissions = 0660
astctlowner = asterisk
astctlgroup = asterisk


[compat]
; =============================================
; Compatibility Options
; =============================================

; PBX realtime compatibility
pbx_realtime = 1.6

; AGI compatibility
res_agi = 1.6

; Set application compatibility
app_set = 1.6


[modules]
; =============================================
; Module Loading
; =============================================

; Automatically load modules
autoload = yes

; Module blacklist (modules to NOT load)
noload => chan_sip.so
noload => chan_iax2.so
noload => chan_dahdi.so
noload => chan_skinny.so
noload => chan_unistim.so
noload => chan_mgcp.so
noload => chan_alsa.so
noload => chan_console.so
noload => codec_dahdi.so
noload => pbx_dundi.so
noload => pbx_ael.so
noload => pbx_lua.so
noload => res_phoneprov.so
noload => res_ael_share.so
noload => res_adsi.so
noload => res_ari.so
noload => res_ari_applications.so
noload => res_ari_channels.so
noload => res_ari_endpoints.so
noload => res_ari_events.so
noload => res_calendar.so
noload => res_config_odbc.so
noload => res_config_pgsql.so
noload => res_config_sqlite.so
noload => res_corosync.so
noload => res_fax.so
noload => res_hep.so
noload => res_http_websocket.so
noload => res_xmpp.so

; Required modules (will be loaded automatically if autoload=yes)
; load => chan_pjsip.so
; load => res_pjsip.so
; load => res_pjsip_session.so
; load => res_rtp_asterisk.so
; load => app_dial.so
; load => app_playback.so
; load => app_userevent.so
; load => func_callerid.so
; load => func_cdr.so
; load => cdr_csv.so


[cdr]
; =============================================
; Call Detail Records Configuration
; =============================================

; Enable CDR
enable = yes

; Log unanswered calls
unanswered = yes

; End CDR before 'h' extension
endbeforehexten = no

; Log initiated seconds
initiatedseconds = no

; CDR batch mode
batch = no
; size = 100
; time = 300

; Safe shutdown
safeshutdown = yes

; Use GMT for timestamps
usegmtime = no

; Log unique ID
loguniqueid = yes

; Log user field
loguserfield = yes

; Account logs
accountlogs = yes

; New CDR columns
newcdrcolumns = yes


[logfiles]
; =============================================
; Logging Configuration (deprecated, use logger.conf)
; =============================================
; See logger.conf for detailed logging configuration
