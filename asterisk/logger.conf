; =============================================
; Asterisk Logger Configuration
; AutoDialer Ultimate v3.0.0
; =============================================

[general]
; =============================================
; General Logging Settings
; =============================================

; Date format for log messages
; %F = YYYY-MM-DD, %T = HH:MM:SS, %q = milliseconds
dateformat = %F %T.%3q

; Append hostname to log messages
; appendhostname = yes

; Queue log (for queue_log)
queue_log = yes

; Queue log file
; queue_log_name = queue_log

; Rotate timestamp in log filename
rotatetimestamp = yes

; Execute 'logger reload' after rotation
; exec_after_rotate = /usr/sbin/asterisk -rx 'logger reload'

; Log unique ID with each message
; uniqueid = yes

; Use local time instead of UTC
; use_localtime = yes

; Full timestamp for each message
; full_timestamp = yes

; Log level colors in console
; console_color = yes


[logfiles]
; =============================================
; Log File Definitions
; Format: filename => levels
; Levels: debug, notice, warning, error, verbose, dtmf, fax, security
; =============================================

; Full log - everything
full => notice,warning,error,debug,verbose,dtmf,fax,security

; Messages log - important events only
messages => notice,warning,error

; Security log - security-related events
security => security

; Console output
console => notice,warning,error,verbose

; Debug log - detailed debugging
debug => debug,dtmf

; Verbose log - verbose output
verbose => verbose,dtmf

; DTMF log - DTMF events only
dtmf => dtmf

; Call Detail Records log (if using file backend)
; cdr => cdr

; Fax log (if using fax)
; fax => fax

; Custom dialer log - specific to AutoDialer
dialer => notice,warning,error,verbose,dtmf


; =============================================
; Syslog Integration
; =============================================
[syslog]
; Send logs to syslog
; facility = local0
; levels = notice,warning,error


; =============================================
; Log Level Descriptions
; =============================================
; debug    - Debugging information (very verbose)
; notice   - Normal but significant events
; warning  - Warning conditions
; error    - Error conditions
; verbose  - Verbose output (controlled by core set verbose)
; dtmf     - DTMF digit events
; fax      - Fax-related events
; security - Security events (failed auth, etc.)
; cdr      - Call Detail Records
