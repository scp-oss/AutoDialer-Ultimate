; =============================================
; Asterisk CDR Configuration
; Call Detail Records
; AutoDialer Ultimate v3.0.0
; =============================================

[general]
; =============================================
; General CDR Settings
; =============================================

; Enable CDR logging
enable = yes

; Log unanswered calls (NOANSWER, BUSY, CONGESTION)
unanswered = yes

; End CDR before 'h' extension
; When yes, CDR ends before hangup handler
endbeforehexten = no

; Log initiated seconds (time from dial to answer)
initiatedseconds = no

; Batch CDR records for better performance
batch = no

; Batch size (records)
; size = 100

; Batch time (seconds)
; time = 300

; Safe shutdown - flush CDR before exit
safeshutdown = yes

; Use GMT for timestamps
usegmtime = no

; Log unique ID for each call
loguniqueid = yes

; Log user field (for custom data)
loguserfield = yes

; Log account code
accountlogs = yes

; Include new CDR columns
newcdrcolumns = yes

; CDR backend to use
; backends = csv,custom

; Ignore duplicate CDR records
; ignoreduplicates = yes

; CDR batch mode safe shutdown
; batchsafeshutdown = yes


[csv]
; =============================================
; CSV CDR Backend
; =============================================

; Use GMT for CSV timestamps
usegmtime = no

; Log unique ID
loguniqueid = yes

; Log user field
loguserfield = yes

; Account logs
accountlogs = yes

; Include new CDR columns
newcdrcolumns = yes

; CSV file location (default: /var/log/asterisk/cdr-csv/Master.csv)
; master_file = /var/log/asterisk/cdr-csv/Master.csv

; CSV file format
; Possible fields:
;   accountcode, src, dst, dcontext, clid, channel, dstchannel,
;   lastapp, lastdata, start, answer, end, duration, billsec,
;   disposition, amaflags, uniqueid, userfield, sequence
; Default format:
; format => "${CDR(accountcode)},\"${CDR(src)}\",\"${CDR(dst)}\",\"${CDR(dcontext)}\",\"${CDR(clid)}\",\"${CDR(channel)}\",\"${CDR(dstchannel)}\",\"${CDR(lastapp)}\",\"${CDR(lastdata)}\",\"${CDR(start)}\",\"${CDR(answer)}\",\"${CDR(end)}\",${CDR(duration)},${CDR(billsec)},\"${CDR(disposition)}\",${CDR(amaflags)},\"${CDR(uniqueid)}\",\"${CDR(userfield)}\",${CDR(sequence)}"

; Extended format with additional fields
format => "${CDR(accountcode)}|${CDR(src)}|${CDR(dst)}|${CDR(dcontext)}|${CDR(clid)}|${CDR(channel)}|${CDR(dstchannel)}|${CDR(lastapp)}|${CDR(lastdata)}|${CDR(start)}|${CDR(answer)}|${CDR(end)}|${CDR(duration)}|${CDR(billsec)}|${CDR(disposition)}|${CDR(amaflags)}|${CDR(uniqueid)}|${CDR(userfield)}|${CDR(sequence)}"


[custom]
; =============================================
; Custom CSV CDR Backend
; =============================================

; Custom CSV file location
master_file = /var/log/asterisk/cdr-custom/Master.csv

; Use GMT for timestamps
usegmtime = no

; Log unique ID
loguniqueid = yes

; Log user field
loguserfield = yes

; Account logs
accountlogs = yes

; Include new CDR columns
newcdrcolumns = yes

; Custom format for dialer-specific fields
; Includes: campaign_id, retry_count, dtmf_result
format => "${CDR(accountcode)}|${CDR(src)}|${CDR(dst)}|${CDR(clid)}|${CDR(channel)}|${CDR(start)}|${CDR(answer)}|${CDR(end)}|${CDR(duration)}|${CDR(billsec)}|${CDR(disposition)}|${CDR(uniqueid)}|${CDR(userfield)}|${CDR(linkedid)}|${CDR(sequence)}"


[sqlite]
; =============================================
; SQLite CDR Backend (Optional)
; =============================================

; Enable SQLite backend
; enable = no

; SQLite database file
; dbname = /var/log/asterisk/cdr.db

; Table name
; table = cdr

; Use GMT
; usegmtime = no

; Log unique ID
; loguniqueid = yes

; Log user field
; loguserfield = yes

; Create table automatically
; autofree = yes


[mysql]
; =============================================
; MySQL CDR Backend (Optional)
; =============================================

; Enable MySQL backend
; enable = no

; MySQL connection string
; connection = mysql://user:password@localhost/asterisk

; Table name
; table = cdr

; Use GMT
; usegmtime = no

; Log unique ID
; loguniqueid = yes

; Log user field
; loguserfield = yes

; Character set
; charset = utf8


[radius]
; =============================================
; RADIUS CDR Backend (Optional)
; =============================================

; Enable RADIUS backend
; enable = no

; RADIUS configuration file
; radiuscfg = /etc/radiusclient-ng/radiusclient.conf

; Use GMT
; usegmtime = no

; Log unique ID
; loguniqueid = yes

; Log user field
; loguserfield = yes


[odbc]
; =============================================
; ODBC CDR Backend (Optional)
; =============================================

; Enable ODBC backend
; enable = no

; ODBC DSN
; dsn = asterisk

; Table name
; table = cdr

; Use GMT
; usegmtime = no

; Log unique ID
; loguniqueid = yes

; Log user field
; loguserfield = yes


[pgsql]
; =============================================
; PostgreSQL CDR Backend (Recommended for AutoDialer)
; =============================================

; Enable PostgreSQL backend
; enable = no

; PostgreSQL connection string
; connection = host=localhost port=5432 dbname=autodialer user=autodialer password=password

; Table name
; table = call_results

; Schema
; schema = public

; Use GMT
; usegmtime = no

; Log unique ID
; loguniqueid = yes

; Log user field
; loguserfield = yes

; Character set
; encoding = UTF8

; CDR field mapping to custom table
; columns => accountcode,src,dst,dcontext,clid,channel,dstchannel,lastapp,lastdata,start,answer,end,duration,billsec,disposition,amaflags,uniqueid,userfield


[tds]
; =============================================
; FreeTDS CDR Backend (Optional)
; =============================================

; Enable FreeTDS backend
; enable = no

; Connection string
; connection = Server=localhost;Port=1433;Database=asterisk;User=sa;Password=password

; Table name
; table = cdr

; Use GMT
; usegmtime = no

; Log unique ID
; loguniqueid = yes

; Log user field
; loguserfield = yes
