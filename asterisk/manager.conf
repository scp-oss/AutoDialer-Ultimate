; =============================================
; Asterisk Manager Interface (AMI) Configuration
; AutoDialer Ultimate v3.0.0
; =============================================

[general]
; =============================================
; General AMI Settings
; =============================================

; Enable AMI
enabled = yes

; Bind address (localhost only for security)
; Use 127.0.0.1 to restrict to local connections
bindaddr = 127.0.0.1

; Port number
port = 5038

; Enable TLS/SSL
; tlsenable = no
; tlsbindaddr = 0.0.0.0:5039
; tlscertfile = /etc/asterisk/keys/asterisk.pem
; tlsprivatekey = /etc/asterisk/keys/asterisk.key

; Display connects in console
displayconnects = no

; Add timestamp to events
timestampevents = yes

; Allow multiple connections from same IP
; allowmultiplelogin = yes

; Enable HTTP interface for AMI
webenabled = no
; webport = 8088

; HTTP timeout
httptimeout = 60

; Debug mode
debug = off

; Block connections from blacklisted IPs
; blockblacklist = yes

; Maximum simultaneous connections
; maxsessions = 10

; Session timeout (seconds)
; sessiontimeout = 3600


; =============================================
; AMI User: autodialer
; Backend service account for dialer operations
; =============================================
[autodialer]
; Secret (password) - will be replaced by install script
secret = ${AMI_PASSWORD}

; Deny all by default
deny = 0.0.0.0/0.0.0.0
deny = ::/0

; Permit localhost only
permit = 127.0.0.1/255.255.255.255
permit = ::1/128

; ACL (Access Control List) - alternative to deny/permit
; acl = localhost

; Read permissions
read = system,call,log,verbose,command,agent,user,config,dtmf,reporting,cdr,dialplan,originate

; Write permissions
write = system,call,log,verbose,command,agent,user,config,dtmf,reporting,originate

; Event filters - reduce noise
eventfilter=!Event: Newexten
eventfilter=!Event: VarSet
eventfilter=!Event: DTMFBegin
eventfilter=!Event: DTMFEnd
eventfilter=!Event: Newstate
eventfilter=!Event: ExtensionStatus
eventfilter=!Event: DeviceStateChange
eventfilter=!Event: PeerStatus
eventfilter=!Event: Registry
eventfilter=!Event: Reload

; Connection limits
; maxconnections = 5

; Session timeout (0 = unlimited)
; sessiontimeout = 0


; =============================================
; AMI User: admin
; Administrative account for manual operations
; =============================================
[admin]
; Secret for admin user
secret = ${ADMIN_AMI_PASSWORD}

; Deny all by default
deny = 0.0.0.0/0.0.0.0
deny = ::/0

; Permit localhost only
permit = 127.0.0.1/255.255.255.255
permit = ::1/128

; Full read permissions
read = all

; Full write permissions
write = all

; Minimal event filters for admin
eventfilter=!Event: VarSet
eventfilter=!Event: Newstate


; =============================================
; AMI User: monitor
; Read-only account for monitoring tools
; =============================================
[monitor]
; Secret for monitor user
secret = ${MONITOR_AMI_PASSWORD}

; Deny all by default
deny = 0.0.0.0/0.0.0.0
deny = ::/0

; Permit localhost and monitoring subnet
permit = 127.0.0.1/255.255.255.255
permit = ::1/128
; permit = 10.0.0.0/255.0.0.0

; Read-only permissions
read = system,call,log,verbose,command,agent,user,dtmf,reporting,cdr

; No write permissions
write =

; Event filters
eventfilter=!Event: VarSet
eventfilter=!Event: Newstate
eventfilter=!Event: DTMFBegin
eventfilter=!Event: DTMFEnd


; =============================================
; Permission Descriptions
; =============================================
; system    - System management (shutdown, restart, reload)
; call      - Call control (originate, hangup, transfer)
; log       - Logging control
; verbose   - Verbose output control
; command   - CLI command execution
; agent     - Agent management
; user      - User management
; config    - Configuration management
; dtmf      - DTMF event reception
; reporting - Reporting functions
; cdr       - CDR access
; dialplan  - Dialplan functions
; originate - Originate calls
; all       - All permissions


; =============================================
; ACL Configuration (Alternative to deny/permit)
; =============================================
; [localhost]
; deny = 0.0.0.0/0.0.0.0
; permit = 127.0.0.1
; permit = ::1


; =============================================
; Template User (for inheritance)
; =============================================
[template_user](!)
; Base template - not a real user
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
eventfilter=!Event: VarSet
eventfilter=!Event: Newstate


; =============================================
; Event Types Description
; =============================================
; Common AMI events useful for dialer:
;
; DialBegin    - Outbound call initiated
; DialEnd      - Dial attempt completed
; BridgeEnter  - Call answered (two channels bridged)
; BridgeLeave  - Call ended
; Hangup       - Channel hung up
; UserEvent    - Custom event from dialplan
; Newchannel   - New channel created
; Newstate     - Channel state changed
; VarSet       - Variable set on channel
; DTMFBegin    - DTMF digit start
; DTMFEnd      - DTMF digit end
;
; Event filters used:
; !Event: VarSet     - Too many events, not needed
; !Event: Newstate   - Not needed for dialer
; !Event: DTMFBegin  - Only need DTMFEnd
; !Event: Newexten   - Not needed
