<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoDialer Ultimate</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23667eea'/%3E%3Ctext x='50' y='70' font-size='50' text-anchor='middle' fill='white'%3E📞%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <h1>📞 AutoDialer Ultimate</h1>
                    <p class="version">v3.0.0</p>
                </div>
                <form id="loginForm" onsubmit="return false;">
                    <div id="loginError" class="error-message"></div>
                    <div class="form-group">
                        <label for="loginUsername">Логин</label>
                        <input type="text" id="loginUsername" placeholder="Введите логин" value="admin" autocomplete="username" autofocus>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Пароль</label>
                        <input type="password" id="loginPassword" placeholder="Введите пароль" value="admin" autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" onclick="App.auth.login()">Войти</button>
                </form>
                <div class="login-footer">
                    <p>Enterprise-grade автообзвон</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Application Screen -->
    <div id="appScreen" style="display: none;">
        <!-- System Bar -->
        <div class="system-bar">
            <div class="system-status">
                <span class="status-indicator" id="sysStatusIndicator">🟢</span>
                <span id="sysStatus">Активна</span>
            </div>
            <div class="system-channels">
                <span>📡 Каналы:</span>
                <span id="sysChannels">0/50</span>
            </div>
            <div class="system-user">
                <span>👤</span>
                <span id="userDisplay"></span>
            </div>
            <button class="kill-switch admin-only" id="killSwitchBtn" onclick="App.system.toggle()">
                🛑 АВАРИЙНАЯ ОСТАНОВКА
            </button>
        </div>

        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1>AutoDialer Ultimate</h1>
                <span class="version-badge">v3.0.0</span>
            </div>
            <div class="header-right">
                <button class="btn btn-outline" onclick="App.users.showProfile()">👤</button>
                <button class="btn btn-outline" onclick="App.auth.logout()">🚪 Выйти</button>
            </div>
        </header>

        <!-- Main Layout -->
        <div class="layout">
            <!-- Sidebar (загружается динамически) -->
            <aside class="sidebar" id="sidebarContainer"></aside>

            <!-- Content Area -->
            <main class="content" id="contentContainer">
                <!-- Вкладки загружаются динамически -->
            </main>
        </div>
    </div>

    <!-- Модальные окна (загружаются динамически) -->
    <div id="modalsContainer"></div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Core -->
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
    
    <!-- Modules -->
    <script src="js/auth.js"></script>
    <script src="js/campaigns.js"></script>
    <script src="js/contacts.js"></script>
    <script src="js/history.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/incoming.js"></script>
    <script src="js/blacklist.js"></script>
    <script src="js/users.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/audit.js"></script>
    <script src="js/apiTokens.js"></script>
    <script src="js/webhooks.js"></script>
    
    <!-- Initialize -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            App.init();
        });
    </script>
</body>
</html>
