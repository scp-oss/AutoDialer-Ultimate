<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoDialer Ultimate</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23667eea'/%3E%3Ctext x='50' y='70' font-size='50' text-anchor='middle' fill='white'%3E📞%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="loginScreen">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <h1>📞 AutoDialer Ultimate</h1>
                    <p class="version">v3.0.0</p>
                </div>
                <form id="loginForm" onsubmit="return false;">
                    <div id="loginError" class="error-message"></div>
                    <div class="form-group">
                        <label for="loginUsername">Логин</label>
                        <input type="text" id="loginUsername" name="username" placeholder="Введите логин" autocomplete="username" autofocus>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Пароль</label>
                        <input type="password" id="loginPassword" name="password" placeholder="Введите пароль" autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" onclick="App.auth.login()">Войти</button>
                </form>
                <div class="login-footer">
                    <p>Enterprise-grade автообзвон</p>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN APPLICATION SCREEN -->
    <div id="appScreen" style="display: none;">
        <!-- System Bar -->
        <div class="system-bar">
            <div class="system-status">
                <span class="status-indicator" id="sysStatusIndicator">🟢</span>
                <span id="sysStatus">Активна</span>
            </div>
            <div class="system-channels">
                <span>📡 Каналы:</span>
                <span id="sysChannels">0/50</span>
            </div>
            <div class="system-queue">
                <span>⏳ Очередь:</span>
                <span id="sysQueueSize">0</span>
            </div>
            <div class="system-user">
                <span>👤</span>
                <span id="userDisplay"></span>
            </div>
            <button class="kill-switch admin-only" id="killSwitchBtn" onclick="App.system.toggle()">
                🛑 АВАРИЙНАЯ ОСТАНОВКА
            </button>
        </div>

        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1>AutoDialer Ultimate</h1>
                <span class="version-badge">v3.0.0</span>
            </div>
            <div class="header-right">
                <button class="btn btn-outline" onclick="App.users.showProfile()" title="Профиль">👤</button>
                <button class="btn btn-outline" onclick="App.auth.logout()" title="Выйти">🚪</button>
            </div>
        </header>

        <!-- Main Layout -->
        <div class="layout">
            <!-- Sidebar -->
            <aside class="sidebar" id="sidebarContainer">
                <div class="loading">Загрузка меню...</div>
            </aside>

            <!-- Content -->
            <main class="content" id="contentContainer">
                <div class="loading">Загрузка...</div>
            </main>
        </div>
    </div>

    <!-- MODALS CONTAINER -->
    <div id="modalsContainer"></div>

    <!-- TOAST CONTAINER -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- SCRIPTS -->
    <!-- External -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Core -->
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
    
    <!-- Auth (должен быть первым) -->
    <script src="js/auth.js"></script>
    
    <!-- System -->
    <script src="js/system.js"></script>
    
    <!-- Feature Modules -->
    <script src="js/dashboard.js"></script>
    <script src="js/campaigns.js"></script>
    <script src="js/campaignHistory.js"></script>
    <script src="js/contacts.js"></script>
    <script src="js/contactGroups.js"></script>
    <script src="js/history.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/incoming.js"></script>
    <script src="js/blacklist.js"></script>
    
    <!-- Admin Modules -->
    <script src="js/users.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/audit.js"></script>
    <script src="js/apiTokens.js"></script>
    <script src="js/webhooks.js"></script>
    
    <!-- Initialize -->
    <script>
        (function() {
            const savedToken = localStorage.getItem('refresh_token');
            if (savedToken) {
                App.state.refreshToken = savedToken;
            }
            
            document.addEventListener('DOMContentLoaded', async () => {
                try {
                    // Единственная точка инициализации приложения - см.
                    // комментарий в app.js о том, почему второй обработчик
                    // DOMContentLoaded был удалён (дублировал автологин).
                    App.init();

                    // Загружаем боковое меню
                    const sidebarResponse = await fetch('components/sidebar.html');
                    document.getElementById('sidebarContainer').innerHTML = await sidebarResponse.text();
                    
                    // Загружаем модальные окна
                    const modalsResponse = await fetch('components/modals.html');
                    document.getElementById('modalsContainer').innerHTML = await modalsResponse.text();
                    
                    // Если есть токен, пробуем автологин
                    if (App.state.refreshToken) {
                        await App.auth.tryAutoLogin();
                    }
                    
                } catch (error) {
                    console.error('Initialization error:', error);
                    App.showToast('Ошибка инициализации', 'error');
                }
            });
        })();
    </script>
</body>
</html>
