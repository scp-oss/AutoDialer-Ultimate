<!-- ============================================= -->
<!-- CAMPAIGN HISTORY TAB - отдельная вкладка "История обзвонов": одна
     строка на каждый ЗАПУСК обзвона (campaign_runs), а не на кампанию -
     "Обзвон" может обзвонить одну и ту же группу много раз ("Запустить
     снова"), и тут должно быть видно каждый прогон отдельно: когда
     запущен, когда завершён, кто и с каким статусом обзвонен. -->
<!-- ============================================= -->
<div class="campaign-history-container">

    <!-- Заголовок с действиями -->
    <div class="page-header">
        <h2>🗂️ История обзвонов</h2>
        <div class="header-actions">
            <button class="btn btn-outline" id="campaignHistoryRefreshBtn" title="Обновить">
                🔄 Обновить
            </button>
        </div>
    </div>

    <!-- Панель фильтров и поиска -->
    <div class="filters-panel">
        <div class="search-box">
            <input type="text"
                   id="campaignHistorySearch"
                   class="form-control"
                   placeholder="🔍 Поиск по названию обзвона..."
                   autocomplete="off">
        </div>
        <div class="filter-group">
            <select id="campaignHistoryStatusFilter" class="form-control">
                <option value="">Все статусы</option>
                <option value="running">Выполняется</option>
                <option value="completed">Завершён</option>
                <option value="stopped">Остановлен</option>
                <option value="failed">Ошибка</option>
            </select>
        </div>
        <div class="filter-actions">
            <button class="btn btn-outline btn-sm" onclick="App.campaignHistory.load()">
                🔍 Применить
            </button>
        </div>
    </div>

    <!-- Таблица запусков -->
    <div class="table-responsive">
        <table class="table" id="campaignHistoryTable">
            <thead>
                <tr>
                    <th width="60">ID</th>
                    <th>Обзвон</th>
                    <th width="120">Статус</th>
                    <th width="150">Прогресс</th>
                    <th width="160">Запущен</th>
                    <th width="160">Завершён</th>
                    <th width="100">Действия</th>
                </tr>
            </thead>
            <tbody id="campaignHistoryTableBody">
                <tr><td colspan="7" class="text-center"><div class="loading">Загрузка...</div></td></tr>
            </tbody>
        </table>
    </div>

    <!-- Пагинация -->
    <div id="campaignHistoryPagination" class="pagination-container"></div>

</div>

<!-- ============================================= -->
<!-- МОДАЛЬНОЕ ОКНО ДЕТАЛЕЙ ЗАПУСКА -->
<!-- ============================================= -->
<div id="runDetailModal" class="modal" style="display: none;">
    <div class="modal-content modal-large">
        <div class="modal-header">
            <h3 id="runDetailTitle">Детали запуска</h3>
            <button class="modal-close" onclick="App.campaignHistory.closeRunDetailModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div id="runDetailContent">
                <div class="loading">Загрузка...</div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button"
                    class="btn btn-outline"
                    onclick="App.campaignHistory.closeRunDetailModal()">
                Закрыть
            </button>
        </div>
    </div>
</div>

<!-- ============================================= -->

     не в общем css/style.css, кроме .status-badge), дублируем по тому
     же принципу, по которому у каждой вкладки свой inline <style> -->
