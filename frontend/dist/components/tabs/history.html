<!-- ============================================= -->
<!-- HISTORY TAB -->
<!-- ============================================= -->
<div class="history-container">
    
    <!-- Заголовок с действиями -->
    <div class="page-header">
        <h2>📜 История звонков</h2>
        <div class="header-actions">
            <button class="btn btn-outline" id="historyRefreshBtn" title="Обновить">
                🔄 Обновить
            </button>
            <button class="btn btn-outline" onclick="App.history.exportToCSV()" title="Экспорт">
                📥 Экспорт CSV
            </button>
            <button class="btn btn-outline" onclick="App.history.showStatistics()" title="Статистика">
                📊 Статистика
            </button>
        </div>
    </div>
    
    <!-- Панель фильтров -->
    <div class="filters-panel history-filters">
        <div class="filter-row">
            <div class="filter-group">
                <label>Кампания</label>
                <select id="historyFilterCampaign" class="form-control">
                    <option value="">Все кампании</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label>Статус</label>
                <!-- Значения = CallResultStatus (app/models/call.py), то же
                     самое пишет диалплан в UserEvent(DialerResult,...) -
                     раньше тут были придуманные значения ('completed',
                     'no_answer', 'cancelled' и т.п.), которых нет ни в этом
                     enum'е, ни в диалплане, так что фильтр либо ничего не
                     находил, либо ловил 422 от FastAPI. -->
                <select id="historyFilterStatus" class="form-control">
                    <option value="">Все статусы</option>
                    <option value="agreed">Подтвердил (нажал 1)</option>
                    <option value="declined">Отказался</option>
                    <option value="busy">Занято</option>
                    <option value="noanswer">Нет ответа</option>
                    <option value="failed">Ошибка</option>
                    <option value="timeout">Прослушал, не подтвердил</option>
                    <option value="canceled">Отменён</option>
                    <option value="machine">Автоответчик</option>
                    <option value="congestion">Перегрузка</option>
                    <option value="chanunavail">Канал недоступен</option>
                    <option value="unknown">Неизвестно</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label>Направление</label>
                <select id="historyFilterDirection" class="form-control">
                    <option value="">Все</option>
                    <option value="outbound">Исходящие</option>
                    <option value="inbound">Входящие</option>
                </select>
            </div>
        </div>
        
        <div class="filter-row">
            <div class="filter-group">
                <label>Номер телефона</label>
                <input type="text" 
                       id="historyFilterPhone" 
                       class="form-control" 
                       placeholder="Поиск по номеру">
            </div>
            
            <div class="filter-group">
                <label>Дата с</label>
                <input type="datetime-local" 
                       id="historyFilterDateFrom" 
                       class="form-control">
            </div>
            
            <div class="filter-group">
                <label>Дата по</label>
                <input type="datetime-local" 
                       id="historyFilterDateTo" 
                       class="form-control">
            </div>
            
            <div class="filter-group filter-actions">
                <button class="btn btn-primary" id="historyApplyFiltersBtn">
                    🔍 Применить
                </button>
                <button class="btn btn-outline" id="historyResetFiltersBtn">
                    🔄 Сбросить
                </button>
            </div>
        </div>
    </div>
    
    <!-- Быстрая статистика -->
    <div class="history-stats-mini">
        <div class="stat-mini">
            <span class="stat-label">Всего звонков:</span>
            <span class="stat-value" id="historyTotalCalls">0</span>
        </div>
        <div class="stat-mini">
            <span class="stat-label">Отвечено:</span>
            <span class="stat-value text-success" id="historyAnswered">0</span>
        </div>
        <div class="stat-mini">
            <span class="stat-label">Дозвон:</span>
            <span class="stat-value" id="historyConversion">0%</span>
        </div>
        <div class="stat-mini">
            <span class="stat-label">Ср. длительность:</span>
            <span class="stat-value" id="historyAvgDuration">0:00</span>
        </div>
    </div>
    
    <!-- Таблица истории -->
    <div class="table-responsive">
        <table class="table history-table" id="historyTable">
            <thead>
                <tr>
                    <th class="sortable" data-sort="created_at">
                        Дата/время <span class="sort-icon">↕️</span>
                    </th>
                    <th class="sortable" data-sort="phone">
                        Номер <span class="sort-icon">↕️</span>
                    </th>
                    <th>Контакт</th>
                    <th class="sortable" data-sort="campaign_id">
                        Кампания <span class="sort-icon">↕️</span>
                    </th>
                    <th class="sortable" data-sort="status">
                        Статус <span class="sort-icon">↕️</span>
                    </th>
                    <th>DTMF</th>
                    <th class="sortable" data-sort="duration">
                        Длит. <span class="sort-icon">↕️</span>
                    </th>
                    <th width="100">Действия</th>
                </tr>
            </thead>
            <tbody id="historyTableBody">
                <tr><td colspan="8" class="text-center"><div class="loading">Загрузка...</div></td></tr>
            </tbody>
        </table>
    </div>
    
    <!-- Пагинация -->
    <div id="historyPagination" class="pagination-container"></div>
    
</div>

<!-- ============================================= -->
<!-- МОДАЛЬНОЕ ОКНО ДЕТАЛЕЙ ЗВОНКА -->
<!-- ============================================= -->
<div id="historyDetailModal" class="modal" style="display: none;">
    <div class="modal-content modal-large">
        <div class="modal-header">
            <h3>📞 Детали звонка</h3>
            <button class="modal-close" onclick="App.history.closeDetailModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div id="historyDetailContent">
                <div class="loading">Загрузка...</div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" 
                    class="btn btn-outline" 
                    onclick="App.history.closeDetailModal()">
                Закрыть
            </button>
            <button type="button" 
                    class="btn btn-primary" 
                    id="historyDownloadDetailBtn">
                📥 Скачать детали
            </button>
        </div>
    </div>
</div>

<!-- ============================================= -->
<!-- МОДАЛЬНОЕ ОКНО СТАТИСТИКИ -->
<!-- ============================================= -->
<div id="historyStatsModal" class="modal" style="display: none;">
    <div class="modal-content modal-large">
        <div class="modal-header">
            <h3>📊 Статистика звонков</h3>
            <button class="modal-close" onclick="App.hideModal('historyStatsModal')">&times;</button>
        </div>
        <div class="modal-body">
            <div id="historyStatsContent">
                <div class="loading">Загрузка статистики...</div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" 
                    class="btn btn-outline" 
                    onclick="App.hideModal('historyStatsModal')">
                Закрыть
            </button>
        </div>
    </div>
</div>

<!-- Логика вкладки (загрузка кампаний для фильтра, привязка фильтров/
     сортировки/кнопок, статистика) живёт в js/history.js. Раньше она была
     здесь, во встроенном <script>, вставляемом через
     `container.innerHTML = await response.text()` в App.switchTab
     (app.js) - браузеры не выполняют <script>, вставленные через
     innerHTML, так что этот блок целиком был мёртвым кодом: он никогда не
     запускался, App.history.init/setupFilterEvents/showStatistics
     оставались теми же (частично несовместимыми с этой разметкой)
     заглушками, что определены в history.js напрямую. Подтверждено:
     кнопки "Применить"/"Сбросить" не работали (не было ни одного
     addEventListener), фильтр кампаний оставался пустым, а
     App.history.showStatistics бил в несуществующий "/history/statistics"
     вместо "/stats/calls". -->
