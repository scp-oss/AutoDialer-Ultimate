<!-- ============================================= -->
<!-- INCOMING CALLS TAB -->
<!-- ============================================= -->
<div class="incoming-container">
    
    <!-- Заголовок с действиями -->
    <div class="page-header">
        <h2>📞 Входящие звонки</h2>
        <div class="header-actions">
            <button class="btn btn-outline" id="incomingRefreshBtn" title="Обновить">
                🔄 Обновить
            </button>
        </div>
    </div>
    
    <!-- Статистика -->
    <div class="incoming-stats">
        <div class="stat-item">
            <span class="stat-label">Всего звонков:</span>
            <span class="stat-value" id="incomingTotal">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Обработано:</span>
            <span class="stat-value text-success" id="incomingProcessed">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">В обработке:</span>
            <span class="stat-value text-warning" id="incomingProcessing">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Ошибок:</span>
            <span class="stat-value text-danger" id="incomingFailed">0</span>
        </div>
    </div>
    
    <!-- Таблица (десктоп) -->
    <div class="incoming-table-container">
        <table class="table incoming-table" id="incomingTable">
            <thead>
                <tr>
                    <th>Дата/Время</th>
                    <th>Номер</th>
                    <th>Длит.</th>
                    <th>Текст</th>
                    <th>Запись</th>
                    <th width="100">Действия</th>
                </tr>
            </thead>
            <tbody id="incomingTableBody">
                <tr><td colspan="6" class="text-center"><div class="loading">Загрузка...</div></td></tr>
            </tbody>
        </table>
    </div>
    
    <!-- Карточки (мобильные) -->
    <div class="incoming-cards" id="incomingCards" style="display: none;"></div>
    
    <!-- Пагинация -->
    <div id="incomingPagination" class="pagination-container"></div>
    
</div>

<!-- ============================================= -->
<!-- МОДАЛЬНОЕ ОКНО ДЕТАЛЕЙ ЗВОНКА -->
<!-- ============================================= -->
<div id="incomingDetailModal" class="modal" style="display: none;">
    <div class="modal-content modal-large">
        <div class="modal-header">
            <h3>📞 Детали входящего звонка</h3>
            <button class="modal-close" onclick="App.incoming.closeDetailModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div id="incomingDetailContent">
                <div class="loading">Загрузка...</div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" 
                    class="btn btn-outline" 
                    onclick="App.incoming.closeDetailModal()">
                Закрыть
            </button>
            <button type="button" 
                    class="btn btn-primary" 
                    id="incomingSaveNotesBtn">
                💾 Сохранить заметки
            </button>
        </div>
    </div>
</div>

<!-- ============================================= -->
<!-- ДОПОЛНИТЕЛЬНЫЕ СТИЛИ -->
<!-- ============================================= -->
<style>
    /* Incoming Container */
    .incoming-container {
        padding: 0;
    }
    
    /* Incoming Stats */
    .incoming-stats {
        display: flex;
        gap: var(--spacing-xl);
        padding: var(--spacing-lg);
        background: var(--color-bg-card);
        border-radius: var(--radius-lg);
        margin-bottom: var(--spacing-xl);
        border: 1px solid var(--color-border);
    }
    
    .incoming-stats .stat-item {
        display: flex;
        align-items: baseline;
        gap: var(--spacing-sm);
    }
    
    .incoming-stats .stat-label {
        color: var(--color-text-muted);
        font-size: 0.9rem;
    }
    
    .incoming-stats .stat-value {
        font-size: 1.5rem;
        font-weight: 600;
    }
    
    /* Incoming Table */
    .incoming-table-container {
        overflow-x: auto;
        margin-bottom: var(--spacing-lg);
    }
    
    .incoming-table {
        width: 100%;
    }
    
    .incoming-table tbody tr {
        cursor: pointer;
        transition: background var(--transition-fast);
    }
    
    .incoming-table tbody tr:hover {
        background: var(--color-bg-tertiary);
    }
    
    .incoming-table tbody tr.processing {
        background: var(--color-warning-bg);
    }
    
    .incoming-table tbody tr.failed {
        background: var(--color-danger-bg);
    }
    
    .incoming-table tbody tr.completed {
        background: var(--color-success-bg);
    }
    
    /* Transcription Status */
    .transcription-status {
        display: inline-block;
        padding: 4px 10px;
        border-radius: var(--radius-full);
        font-size: 0.8rem;
        font-weight: 500;
    }
    
    .transcription-status.pending {
        background: var(--color-bg-tertiary);
        color: var(--color-text-muted);
    }
    
    .transcription-status.processing {
        background: var(--color-warning-bg);
        color: var(--color-warning);
        animation: pulse 1.5s infinite;
    }
    
    .transcription-status.completed {
        background: var(--color-success-bg);
        color: var(--color-success);
    }
    
    .transcription-status.failed {
        background: var(--color-danger-bg);
        color: var(--color-danger);
    }
    
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
    }
    
    .transcription-text {
        display: block;
        max-width: 300px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--color-text-secondary);
    }
    
    /* Mini Audio Player */
    .mini-audio-player {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
    }
    
    .play-pause-btn {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1px solid var(--color-border);
        background: var(--color-bg-tertiary);
        color: var(--color-text-primary);
        cursor: pointer;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all var(--transition-fast);
    }
    
    .play-pause-btn:hover {
        background: var(--color-primary);
        color: white;
        border-color: var(--color-primary);
    }
    
    .audio-duration {
        font-size: 0.8rem;
        color: var(--color-text-muted);
    }
    
    /* Mobile Cards */
    .incoming-cards {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-md);
    }
    
    .incoming-card {
        background: var(--color-bg-card);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        padding: var(--spacing-md);
        cursor: pointer;
        transition: all var(--transition-fast);
    }
    
    .incoming-card:hover {
        box-shadow: var(--shadow-md);
    }
    
    .incoming-card.processing {
        border-left: 4px solid var(--color-warning);
    }
    
    .incoming-card.completed {
        border-left: 4px solid var(--color-success);
    }
    
    .incoming-card.failed {
        border-left: 4px solid var(--color-danger);
    }
    
    .card-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: var(--spacing-sm);
    }
    
    .card-date {
        color: var(--color-text-muted);
        font-size: 0.85rem;
    }
    
    .card-phone {
        font-weight: 600;
    }
    
    .card-body {
        margin-bottom: var(--spacing-md);
    }
    
    .card-duration {
        margin-bottom: var(--spacing-sm);
        font-size: 0.9rem;
    }
    
    .card-transcription {
        margin-bottom: var(--spacing-md);
    }
    
    .transcription-preview {
        background: var(--color-bg-tertiary);
        padding: var(--spacing-sm);
        border-radius: var(--radius-md);
        font-size: 0.9rem;
        max-height: 80px;
        overflow-y: auto;
    }
    
    .transcription-status-badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: var(--radius-full);
        font-size: 0.8rem;
    }
    
    .card-footer {
        display: flex;
        justify-content: flex-end;
        gap: var(--spacing-sm);
    }
    
    /* Detail Modal */
    .call-detail {
        max-height: 65vh;
        overflow-y: auto;
    }
    
    .detail-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: var(--spacing-md);
        margin-bottom: var(--spacing-lg);
    }
    
    .detail-item {
        display: flex;
        flex-direction: column;
    }
    
    .detail-label {
        font-size: 0.8rem;
        color: var(--color-text-muted);
        margin-bottom: var(--spacing-xs);
    }
    
    .detail-value {
        font-weight: 500;
    }
    
    .detail-section {
        margin-bottom: var(--spacing-lg);
        padding-bottom: var(--spacing-lg);
        border-bottom: 1px solid var(--color-border);
    }
    
    .detail-section:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
    }
    
    .detail-section h4 {
        margin-top: 0;
        margin-bottom: var(--spacing-md);
        color: var(--color-text-secondary);
    }
    
    .transcription-box {
        background: var(--color-bg-tertiary);
        padding: var(--spacing-md);
        border-radius: var(--radius-md);
        max-height: 200px;
        overflow-y: auto;
        line-height: 1.5;
        white-space: pre-wrap;
    }
    
    .audio-player-full {
        width: 100%;
        margin-top: var(--spacing-sm);
    }
    
    /* Empty State */
    .empty-state {
        text-align: center;
        padding: var(--spacing-3xl) var(--spacing-xl);
    }
    
    .empty-icon {
        font-size: 4rem;
        margin-bottom: var(--spacing-lg);
        opacity: 0.5;
    }
    
    .empty-state p {
        margin-bottom: var(--spacing-lg);
        color: var(--color-text-muted);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
        .incoming-table-container {
            display: none;
        }
        
        .incoming-cards {
            display: flex;
        }
        
        .incoming-stats {
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }
        
        .detail-grid {
            grid-template-columns: 1fr;
        }
    }
    
    @media (min-width: 769px) {
        .incoming-cards {
            display: none;
        }
    }
    
    @media (max-width: 480px) {
        .incoming-stats {
            flex-direction: column;
            gap: var(--spacing-sm);
        }
        
        .card-header {
            flex-direction: column;
            gap: var(--spacing-xs);
        }
    }
</style>

    Инлайновый <script> здесь раньше пытался расширить App.incoming - но
