name: Tests

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: autodialer
          POSTGRES_PASSWORD: autodialer_test
          POSTGRES_DB: autodialer_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: autodialer_test
      DB_USER: autodialer
      DB_PASSWORD: autodialer_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      AMI_HOST: 127.0.0.1
      AMI_PORT: 5038
      AMI_USER: autodialer
      AMI_PASSWORD: test_ami_password
      JWT_SECRET: ci_test_secret_key_at_least_32_characters_long
      ENVIRONMENT: development

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: app/requirements/dev.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements/dev.txt

    - name: Lint with ruff (correctness: undefined names, syntax errors)
      run: ruff check --select=F821,F822,F823,E9 app

    - name: Lint with ruff (style, advisory only)
      run: ruff check app
      continue-on-error: true

    - name: Type check with mypy
      run: mypy app --ignore-missing-imports
      continue-on-error: true

    - name: Run database migrations
      run: alembic upgrade head

    - name: Test with pytest
      run: pytest tests/ --cov=app --cov-report=xml -v

    - name: Upload coverage
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
