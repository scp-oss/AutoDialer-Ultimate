# =============================================
# AutoDialer Ultimate - Nginx Configuration
# Версия: 3.0.0
# Расположение: /etc/nginx/sites-available/autodialer.conf
# =============================================
# ВКЛЮЧЕНЫ ВСЕ ИСПРАВЛЕНИЯ:
# - Upstream с least_conn и keepalive
# - Rate limiting (api, login, audio)
# - WebSocket поддержка
# - CORS для аудио
# - Security headers
# - Сжатие gzip
# - Кэширование статики
# - Ограничение доступа к /metrics
# =============================================

# =============================================
# Upstream для бэкенда
# =============================================
upstream autodialer_backend {
    # Балансировка по наименьшему количеству соединений
    least_conn;
    
    # Бэкенд серверы (можно добавить больше для масштабирования).
    # "backend" — имя сервиса в docker-compose.yml; для bare-metal
    # установки (install.sh) замените на 127.0.0.1:8000.
    server backend:8000 max_fails=3 fail_timeout=30s;
    
    # Keepalive соединения
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# =============================================
# Rate Limiting Zones
# =============================================
# Общий лимит для API
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Строгий лимит для логина (защита от брутфорса)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# Лимит для генерации аудио
limit_req_zone $binary_remote_addr zone=audio_limit:10m rate=2r/s;

# Лимит соединений
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# =============================================
# WebSocket Upgrade Map
# =============================================
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# =============================================
# Trusted Proxies Map (для X-Forwarded-For)
# =============================================
map $remote_addr $trusted_ip {
    default 0;
    127.0.0.1 1;
    ::1 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
}

# =============================================
# Основной сервер (HTTP)
# =============================================
server {
    listen 80 default_server;
    # IPv4-only: a hardcoded "listen [::]:80" crashes nginx outright
    # (socket() [::]:80 failed: Address family not supported by protocol)
    # on any host/container whose network namespace has no IPv6 support
    # at all (no /proc/net/if_inet6) - common on restricted Docker hosts/
    # CI runners. Confirmed by actually running docker compose up in such
    # an environment. IPv6 was never a stated requirement for this
    # project, so this trades away dual-stack support for guaranteed
    # startup across all deployment targets.
    server_name _;
    
    # =============================================
    # Базовые настройки
    # =============================================
    # Максимальный размер тела запроса (для загрузки аудио)
    client_max_body_size 50M;
    
    # Таймауты
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    
    # Прокси таймауты
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;
    
    # Буферизация
    proxy_buffering off;
    proxy_request_buffering off;
    
    # =============================================
    # Лимиты соединений
    # =============================================
    limit_conn conn_limit 100;
    limit_conn_status 429;
    
    # =============================================
    # Security Headers
    # =============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Скрываем версию Nginx
    server_tokens off;
    proxy_hide_header X-Powered-By;
    
    # =============================================
    # Сжатие gzip
    # =============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # =============================================
    # API Endpoints
    # =============================================
    location /api {
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        
        # Проксирование
        proxy_pass http://autodialer_backend;
        proxy_http_version 1.1;
        
        # Заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        # WebSocket поддержка
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Отключаем кэширование для API
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    
    # =============================================
    # Auth Endpoints (строгий rate limit)
    # =============================================
    location /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        
        proxy_pass http://autodialer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
    
    location /api/auth/refresh {
        proxy_pass http://autodialer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /api/auth/logout {
        proxy_pass http://autodialer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /api/auth/change-password {
        proxy_pass http://autodialer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # =============================================
    # Audio Generation (rate limited)
    # =============================================
    location /api/audio/generate {
        limit_req zone=audio_limit burst=5 nodelay;
        limit_req_status 429;
        
        proxy_pass http://autodialer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
    }
    
    # =============================================
    # Audio Upload
    # =============================================
    location /api/audio/upload {
        client_max_body_size 20M;
        
        proxy_pass http://autodialer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 180s;
    }
    
    # =============================================
    # API Documentation
    # =============================================
    location /docs {
        proxy_pass http://autodialer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /redoc {
        proxy_pass http://autodialer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /openapi.json {
        proxy_pass http://autodialer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # =============================================
    # Metrics Endpoint (Restricted)
    # =============================================
    location /metrics {
        # Только внутренние сети
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        proxy_pass http://autodialer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Отключаем кэширование
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    # =============================================
    # Health Check
    # =============================================
    location /api/health {
        proxy_pass http://autodialer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Отключаем кэширование
        add_header Cache-Control "no-cache";
    }
    
    # =============================================
    # WebSocket
    # =============================================
    location /ws {
        proxy_pass http://autodialer_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Длинные таймауты для WebSocket
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    
    # =============================================
    # Static Frontend Files
    # =============================================
    location / {
        root /opt/autodialer/frontend/dist;
        try_files $uri $uri/ /index.html;
        index index.html;
        
        # Кэширование статических ресурсов
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
            try_files $uri =404;
        }
        
        # HTML файлы не кэшируем
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }
    }
    
    # =============================================
    # Audio Files Serving (for playback)
    # =============================================
    location /audio/ {
        alias /var/lib/asterisk/sounds/tts/;
        
        # CORS для аудио
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
        
        # Поддержка range requests (для перемотки)
        add_header Accept-Ranges bytes;
        
        # Кэширование аудио
        expires 7d;
        add_header Cache-Control "public, immutable";
        
        # Обработка OPTIONS для CORS
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Range, Content-Type";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
    }
    
    # =============================================
    # Call Recordings (if enabled)
    # =============================================
    location /recordings/ {
        alias /var/spool/asterisk/monitor/;
        
        # Аутентификация через бэкенд
        auth_request /api/auth/verify;
        
        # Поддержка range requests
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin "*";
        
        # Кэширование
        expires 30d;
        add_header Cache-Control "public";
    }
    
    # =============================================
    # Favicon и robots
    # =============================================
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        try_files /favicon.ico =204;
    }
    
    location = /robots.txt {
        log_not_found off;
        access_log off;
        return 200 "User-agent: *\nDisallow: /api/\nDisallow: /metrics\n";
    }
    
    # =============================================
    # Deny hidden files
    # =============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # =============================================
    # Deny sensitive files
    # =============================================
    location ~* \.(sql|log|ini|yml|yaml|env|git|bak|backup|old|swp|swo)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # =============================================
    # Error Pages
    # =============================================
    error_page 404 /index.html;
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
    
    # Кастомная страница для rate limit
    error_page 429 /429.html;
    location = /429.html {
        return 429 '{"error": "Rate limit exceeded", "retry_after": 60}';
        add_header Content-Type application/json;
        add_header Retry-After 60;
    }
}


