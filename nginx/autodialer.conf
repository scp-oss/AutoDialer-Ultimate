# =============================================
# Nginx Configuration for AutoDialer Ultimate
# =============================================

# Upstream backend servers
upstream autodialer_backend {
    # Least connections balancing
    least_conn;
    
    # Backend servers (can add more for scaling)
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    
    # Keep connections alive
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=audio_limit:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Map for WebSocket upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# =============================================
# HTTP Server (Port 80)
# =============================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    
    # Redirect to HTTPS if SSL is configured
    # return 301 https://$host$request_uri;
    
    # Maximum client body size (for audio uploads)
    client_max_body_size 50M;
    
    # Client timeouts
    client_body_timeout 60s;
    client_header_timeout 60s;
    
    # Send timeouts
    send_timeout 60s;
    
    # Proxy settings
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;
    
    # Buffering
    proxy_buffering off;
    proxy_request_buffering off;
    
    # Connection limits
    limit_conn conn_limit 100;
    limit_conn_status 429;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Hide server version
    server_tokens off;
    proxy_hide_header X-Powered-By;
    
    # =============================================
    # API Endpoints
    # =============================================
    location /api {
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        
        # Proxy to backend
        proxy_pass http://autodialer_backend;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Disable caching for API
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    
    # =============================================
    # Auth Endpoints (stricter rate limits)
    # =============================================
    location /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        
        proxy_pass http://autodialer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
    
    # =============================================
    # Audio Generation (rate limited)
    # =============================================
    location /api/audio/generate {
        limit_req zone=audio_limit burst=5 nodelay;
        limit_req_status 429;
        
        proxy_pass http://autodialer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
    }
    
    # =============================================
    # Audio Upload
    # =============================================
    location /api/audio/upload {
        client_max_body_size 20M;
        
        proxy_pass http://autodialer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 180s;
    }
    
    # =============================================
    # API Documentation
    # =============================================
    location /docs {
        proxy_pass http://autodialer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /redoc {
        proxy_pass http://autodialer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /openapi.json {
        proxy_pass http://autodialer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # =============================================
    # Metrics Endpoint (Restricted)
    # =============================================
    location /metrics {
        # Allow only internal networks
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        proxy_pass http://autodialer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # =============================================
    # Health Check
    # =============================================
    location /api/health {
        proxy_pass http://autodialer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # =============================================
    # WebSocket
    # =============================================
    location /ws {
        proxy_pass http://autodialer_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    
    # =============================================
    # Static Frontend Files
    # =============================================
    location / {
        root /opt/autodialer/frontend/dist;
        try_files $uri $uri/ /index.html;
        index index.html;
        
        # Caching for static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
        }
        
        # HTML files - no cache
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
    
    # =============================================
    # Audio Files Serving (for playback)
    # =============================================
    location /audio/ {
        alias /var/lib/asterisk/sounds/tts/;
        
        # CORS for audio playback
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Range";
        
        # Support range requests for seeking
        add_header Accept-Ranges bytes;
        
        # Cache audio files
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    
    # =============================================
    # Call Recordings (if enabled)
    # =============================================
    location /recordings/ {
        alias /var/spool/asterisk/monitor/;
        
        # Authentication required (handled by backend)
        # Internal redirect to backend for auth check
        auth_request /api/auth/verify;
        
        # Support range requests
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin "*";
    }
    
    # =============================================
    # Favicon and robots
    # =============================================
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
    
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
    
    # =============================================
    # Deny hidden files
    # =============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # =============================================
    # Error Pages
    # =============================================
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

