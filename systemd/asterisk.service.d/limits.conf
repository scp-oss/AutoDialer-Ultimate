# =============================================
# Asterisk Systemd Limits Override
# AutoDialer Ultimate v3.0.0
# =============================================
# Location: /etc/systemd/system/asterisk.service.d/limits.conf
# =============================================

[Unit]
# Wait for network to be fully online before starting
After=network-online.target
Wants=network-online.target

# Ensure time is synchronized
After=time-sync.target
Wants=time-sync.target

[Service]
# =============================================
# File Descriptor Limits
# =============================================
# Asterisk needs many file descriptors for concurrent calls
# Each call uses multiple file descriptors (SIP socket, RTP sockets, etc.)
LimitNOFILE=655350
LimitNOFILESoft=655350

# =============================================
# Process Limits
# =============================================
# Maximum number of processes/threads
LimitNPROC=655350
LimitNPROCSoft=655350

# =============================================
# Memory Limits
# =============================================
# Lock memory (prevent swapping)
LimitMEMLOCK=infinity

# Maximum memory usage (2GB)
MemoryMax=2G
MemoryHigh=1.5G

# =============================================
# CPU Limits
# =============================================
# CPU quota (200% = 2 cores)
CPUQuota=200%

# CPU scheduling priority
# CPUSchedulingPolicy=rr
# CPUSchedulingPriority=80

# =============================================
# Task Limits
# =============================================
# Maximum number of tasks
TasksMax=infinity

# =============================================
# User and Group
# =============================================
User=asterisk
Group=asterisk

# =============================================
# Runtime Directory
# =============================================
RuntimeDirectory=asterisk
RuntimeDirectoryMode=0755

# =============================================
# Security Hardening
# =============================================
# Prevent service from gaining new privileges
NoNewPrivileges=no

# Protect system directories
ProtectSystem=strict
ProtectHome=yes

# Private /tmp
PrivateTmp=yes

# Protect kernel tunables
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes

# Restrict network access (Asterisk needs network)
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK

# Restrict system calls
SystemCallFilter=@system-service @network-io @signal @timer
SystemCallArchitectures=native

# =============================================
# Restart Behavior
# =============================================
Restart=always
RestartSec=10
StartLimitInterval=60
StartLimitBurst=3

# =============================================
# Nice and I/O Priority
# =============================================
# Higher priority for real-time audio
Nice=-10
IOSchedulingClass=realtime
IOSchedulingPriority=0

# =============================================
# Environment
# =============================================
Environment="TZ=UTC"
Environment="LANG=en_US.UTF-8"
Environment="LC_ALL=en_US.UTF-8"

# =============================================
# Core Dump
# =============================================
# Limit core dump size (0 = disabled)
LimitCORE=0

# =============================================
# Address Space
# =============================================
LimitAS=infinity
LimitRSS=infinity

# =============================================
# Additional Sandboxing
# =============================================
# Protect hostname
ProtectHostname=yes

# Protect clock
ProtectClock=yes

# Protect kernel logs
ProtectKernelLogs=yes

# =============================================
# ExecStart Override (if needed)
# =============================================
# Uncomment to override the main ExecStart
# ExecStart=
# ExecStart=/usr/sbin/asterisk -f -U asterisk -G asterisk -p -g
